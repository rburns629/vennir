# Go for the kernel (`make proto`): kernel-api's own API, and the catalog
# release format `kernel policy` reads, from the plugins pinned as tools in
# cli/go.mod. Output is committed.
version: v2
clean: true
inputs:
  - directory: proto
    paths: [proto/vennir/kernel, proto/vennir/catalog]
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rburns629/vennir/kernel/internal/gen
plugins:
  - local: protoc-gen-go
    out: kernel/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: kernel/internal/gen
    opt: paths=source_relative

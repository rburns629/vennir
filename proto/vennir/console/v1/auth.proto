syntax = "proto3";

package vennir.console.v1;

import "google/protobuf/timestamp.proto";

// Signing in, and who you are. Bots don't sign in: they send their API
// token as the bearer token directly.
service AuthService {
  // Which deployment this is. Anyone, signed in or not.
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Creates your own account, when open registration is on (off by
  // default: admins create accounts with UserService.CreateUser).
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Returns a session token. Rate limited per client and per email, and
  // spaced out after repeated failures on one account (resource_exhausted,
  // with a Retry-After).
  rpc Login(LoginRequest) returns (LoginResponse);
  // Signs a bot in with its CI's own OIDC identity instead of a stored
  // token (keyless): a GitHub Actions or GitLab job's ID token, for this
  // install's audience, matching exactly one bot's identity
  // (TokenService.AddBotIdentity). Returns an hour's session as that bot.
  // Refused (unauthenticated, KEYLESS_REFUSED) otherwise.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);
  // Who you are, and your teams.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Changes your password (people only), signing out your other sessions;
  // returns a fresh token for this one.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Ends this session: its token is refused from now on, by the console
  // and the gateway. An API token is revoked with TokenService.RevokeToken
  // instead.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetEnvironmentRequest {}

message GetEnvironmentResponse {
  // Shown on every page, such as "local" or "production".
  string label = 1;
  bool self_registration = 2;
  // Single sign-on, when on: the provider's name for its button ("Google").
  // Sign in from the sign-in page (/api/auth/oidc/start?tab=, the tab's own value). Passwords still work, except for the
  // members of a team that requires single sign-on (Team.require_sso).
  string sso_label = 3;
  // The cloud this install is on (gcp, aws, azure, kind, existing), as
  // vennir set it; empty when it isn't known, and every product runs here.
  string cloud = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  // Send as Authorization: Bearer <token>.
  string token = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message GetMeRequest {}

message GetMeResponse {
  string user_id = 1;
  string email = 2;
  repeated string team_names = 3;
  bool is_admin = 4;
  // The teams in team_names this person maintains.
  repeated string maintainer_of = 5;
  // Signed in with a password someone else set (a new account's, an
  // admin's reset): nothing but ChangePassword works until it's changed
  // (permission_denied, PASSWORD_CHANGE_REQUIRED).
  bool must_change_password = 6;
  // How they sign in: a password of their own, single sign-on (bound at
  // its first), or both.
  bool has_password = 7;
  bool uses_sso = 8;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
  string token = 1;
}

message ExchangeTokenRequest {
  // The CI's ID token (a JWT), for the install's keyless audience.
  string id_token = 1;
}

message ExchangeTokenResponse {
  // Send as Authorization: Bearer <token>, for an hour.
  string token = 1;
  // The bot it signed in as.
  string email = 2;
  google.protobuf.Timestamp expires_at = 3;
}

syntax = "proto3";

package vennir.console.v1;

import "vennir/console/v1/common.proto";
import "google/protobuf/timestamp.proto";

// API products (decision 20): a backend a team already runs, published
// through this install's gateway. Its OpenAPI file is the allowlist: the
// gateway forwards only requests whose method and path are an operation
// there and that fit its schemas, and blocks everything else. An API comes
// from its team's catalog (apis/<name>/api.yaml); pausing one is the only
// change made here.
//
// Everyone signed in sees the APIs that aren't hidden; they may call one
// (may_call) when it's their own team's, when it's granted to them or to a
// single sign-on group they're in, or, for this release, when its
// api.yaml's shareWith names one of their teams (decision 26). The
// backend's address and how the gateway signs in there are shown to the
// API's own team only.
//
// Access (decision 26): each API has grants, to a group (each person in it)
// or to one user (a person or a bot), each with its rate. Only the API's
// team's maintainers add grants or change their rates. A person asks for
// access for themselves, offering none or some of their groups; a
// maintainer of a bot's team asks for the bot. The API's maintainers
// approve (granting the person, or one of the groups they offered) or
// decline. Revoking: the API's maintainers, an admin, the
// person a grant names, or the maintainers of the bot it names. Every
// change is audited and told to whoever it's for and the API's maintainers.
service ApiService {
  // Every API the caller may see, by team and name.
  rpc ListApis(ListApisRequest) returns (ListApisResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // One API, with its OpenAPI document. Not found and hidden look the same.
  rpc GetApi(GetApiRequest) returns (GetApiResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Stops an API for an incident: every signed-in caller gets 503 with its
  // message (anyone else, 404) until it's resumed, and nothing reaches the
  // backend. A maintainer of its team, or an admin.
  rpc PauseApi(PauseApiRequest) returns (PauseApiResponse);
  // Lets a paused API through again; as PauseApi.
  rpc ResumeApi(ResumeApiRequest) returns (ResumeApiResponse);
  // What callers sent an API, what the gateway stopped and what its
  // backend answered, over the last hours (at most a week): by endpoint,
  // the requests its spec doesn't describe, and by calling team. Its own
  // team, and admins.
  rpc GetApiTraffic(GetApiTrafficRequest) returns (GetApiTrafficResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The gateway's settings (this install's Helm values), whether it's
  // closed, and what it refused at the door over the last day. Admins.
  rpc GetGateway(GetGatewayRequest) returns (GetGatewayResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Closes the gateway (a message: every API answers 503 with it, and
  // nothing is forwarded) or reopens it (empty). Admins; audited.
  rpc SetGatewayClosed(SetGatewayClosedRequest) returns (SetGatewayClosedResponse);

  // Asks for access to an API, with a reason: a person for themselves, or a
  // maintainer of a bot's team for that bot (bot_email). Refused when its
  // api.yaml takes no requests (access.requests: closed), when whoever
  // it's for may call it already (but only "from the catalog", by its
  // api.yaml's shareWith: then a grant may be asked for), or while a
  // request of theirs waits. An API whose requests are open grants it at
  // once, at its default limit.
  rpc RequestApiAccess(RequestApiAccessRequest) returns (RequestApiAccessResponse);
  // Withdraws a request while it waits: whoever asked, or, for a bot's, a
  // maintainer of one of the bot's teams that isn't retired.
  rpc WithdrawApiAccessRequest(WithdrawApiAccessRequestRequest) returns (WithdrawApiAccessRequestResponse);
  // Grants (approve) or declines a waiting request: a maintainer of the
  // API's team. Granting a person may grant one of the groups they offered
  // instead (and only those); a bot is granted by name only.
  rpc DecideApiAccessRequest(DecideApiAccessRequestRequest) returns (DecideApiAccessRequestResponse);
  // Grants a group or a user (a person or a bot, by email) access: a
  // maintainer of the API's team (not an admin, unless they maintain it).
  rpc AddApiGrant(AddApiGrantRequest) returns (AddApiGrantResponse);
  // Changes a grant's rate: a maintainer of the API's team.
  rpc SetApiGrantRate(SetApiGrantRateRequest) returns (SetApiGrantRateResponse);
  // Revokes a grant: a maintainer of the API's team, an admin, the person
  // it names, or a maintainer of the bot's team it names. The gateway stops
  // its calls within its refresh (well under a minute).
  rpc RevokeApiGrant(RevokeApiGrantRequest) returns (RevokeApiGrantResponse);
  // An API's grants (active and revoked) and requests: its own team, and
  // admins.
  rpc ListApiAccess(ListApiAccessRequest) returns (ListApiAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The APIs the caller may call, and how (their team's, granted to them,
  // through a group, from the catalog), and their requests that wait or
  // were declined.
  rpc ListMyApiAccess(ListMyApiAccessRequest) returns (ListMyApiAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A team's bots' grants and requests: its members, and admins.
  rpc ListTeamBotApiAccess(ListTeamBotApiAccessRequest) returns (ListTeamBotApiAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The grants and requests of a team's APIs that left the catalog's
  // release (away_since): kept 30 days, to come back with an API of the
  // same name, and revocable meanwhile by the team's maintainers and
  // admins. Its members, and admins.
  rpc ListAwayApiAccess(ListAwayApiAccessRequest) returns (ListAwayApiAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Every active grant on this install, newest first, a page at a time:
  // published APIs' and away ones' (away_since), for an incident (an admin
  // revokes; the APIs' teams add and change them). With how many there are
  // of each kind, and the requests waiting. Admins.
  rpc ListAllApiGrants(ListAllApiGrantsRequest) returns (ListAllApiGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// How a caller may call an API (the gateway's rule, in its order).
enum ApiAccessVia {
  API_ACCESS_VIA_UNSPECIFIED = 0;
  // They're in its own team (a member or a bot).
  API_ACCESS_VIA_TEAM = 1;
  // A grant names them.
  API_ACCESS_VIA_USER = 2;
  // A grant names a single sign-on group they're in.
  API_ACCESS_VIA_GROUP = 3;
  // Its api.yaml's shareWith names a team of theirs: from the catalog, not
  // revocable here. Deprecated: goes with shareWith.
  API_ACCESS_VIA_CATALOG = 4;
}

enum ApiAccessRequestState {
  API_ACCESS_REQUEST_STATE_UNSPECIFIED = 0;
  API_ACCESS_REQUEST_STATE_WAITING = 1;
  API_ACCESS_REQUEST_STATE_GRANTED = 2;
  API_ACCESS_REQUEST_STATE_DECLINED = 3;
  API_ACCESS_REQUEST_STATE_WITHDRAWN = 4;
}

message ApiGrant {
  string id = 1;
  // The API: <team>/<name>.
  string team = 2;
  string name = 3;
  // Exactly one of: a single sign-on group (lowercased), or a user.
  string group = 4;
  string user_id = 5;
  string user_email = 6;
  bool bot = 7;
  // Requests a minute: the user's, or each of the group's members'. With
  // default_rate, it's the API's default limit, and follows it.
  int32 per_minute = 8;
  bool default_rate = 9;
  // Who granted it (an email); empty for an open API's request.
  string granted_by = 10;
  // The request it answered, if any.
  string access_request_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // Set once revoked.
  google.protobuf.Timestamp revoked_at = 14;
  string revoked_by = 15;
  // Why the platform revoked it (superseded by a grant made while its API
  // was away), when it did.
  string revoke_reason = 16;
  // When its API left the catalog's release; unset while it's published.
  // Removed 30 days after.
  google.protobuf.Timestamp away_since = 17;
}

message ApiAccessRequest {
  string id = 1;
  string team = 2;
  string name = 3;
  // Whom it's for: the person, or the bot.
  string user_id = 4;
  string user_email = 5;
  bool bot = 6;
  // Who asked (an email): the person, or the bot's team's maintainer.
  string requested_by = 7;
  string reason = 8;
  ApiAccessRequestState state = 9;
  // Who granted, declined or withdrew it, and a decline's reason.
  string decided_by = 10;
  string decision_reason = 11;
  string grant_id = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp decided_at = 14;
  // The single sign-on groups the person offered when they asked (none,
  // or some of theirs), one of which may be granted instead: shown to the
  // API's maintainers only, and only while it waits. Never the person's
  // other groups.
  repeated string groups = 15;
  // When those groups were read (when they asked, or a later sign-in that
  // read them all again): older than 24 hours, a group can't be granted
  // from them (GROUPS_STALE) unless Google Workspace confirms it.
  google.protobuf.Timestamp groups_read_at = 16;
  // When its API left the catalog's release; unset while it's published.
  google.protobuf.Timestamp away_since = 17;
}

message RequestApiAccessRequest {
  string team = 1;
  string name = 2;
  // Why: the API's maintainers read it. At most 1000 characters.
  string reason = 3;
  // For a bot of a team the caller maintains; empty: for the caller.
  string bot_email = 4;
  // For the caller: which of their single sign-on groups (as last read,
  // while they count) the API's maintainers may grant instead of them.
  // Empty: none, so they're granted by name. Never for a bot.
  repeated string groups = 5;
}

message RequestApiAccessResponse {
  ApiAccessRequest request = 1;
  // Set when its requests are open: the grant made at once.
  ApiGrant grant = 2;
}

message WithdrawApiAccessRequestRequest {
  string access_request_id = 1;
}

message WithdrawApiAccessRequestResponse {}

message DecideApiAccessRequestRequest {
  string access_request_id = 1;
  bool approve = 2;
  // Approving a person's: grant this group of theirs instead of the person.
  string group = 3;
  // Approving: requests a minute; 0, the API's default limit.
  int32 per_minute = 4;
  // Declining: why (required), which the person is told.
  string reason = 5;
}

message DecideApiAccessRequestResponse {
  ApiAccessRequest request = 1;
  ApiGrant grant = 2;
}

message AddApiGrantRequest {
  string team = 1;
  string name = 2;
  // Exactly one of: a single sign-on group, or a user by email.
  string group = 3;
  string email = 4;
  // Requests a minute; 0, the API's default limit.
  int32 per_minute = 5;
}

message AddApiGrantResponse {
  ApiGrant grant = 1;
}

message SetApiGrantRateRequest {
  string grant_id = 1;
  // Requests a minute; 0, the API's default limit.
  int32 per_minute = 2;
}

message SetApiGrantRateResponse {
  ApiGrant grant = 1;
}

message RevokeApiGrantRequest {
  string grant_id = 1;
  // Why, for the audit log and whoever it named. Optional.
  string reason = 2;
}

message RevokeApiGrantResponse {}

message ListApiAccessRequest {
  string team = 1;
  string name = 2;
}

message ListApiAccessResponse {
  // Active ones first, then revoked, newest first.
  repeated ApiGrant grants = 1;
  // Waiting ones first, then the rest, newest first.
  repeated ApiAccessRequest requests = 2;
  // From the catalog (shareWith, deprecated): teams whose members and bots
  // may call it, not revocable here.
  repeated string share_with = 3;
}

message MyApiAccess {
  string team = 1;
  string name = 2;
  ApiAccessVia via = 3;
  // VIA_TEAM and VIA_CATALOG: the team the gateway counts calls against.
  string calling_team = 4;
  // VIA_GROUP: the group; VIA_USER and VIA_GROUP: the grant.
  string group = 5;
  string grant_id = 6;
  int32 per_minute = 7;
}

message ListMyApiAccessRequest {}

message ListMyApiAccessResponse {
  repeated MyApiAccess access = 1;
  // Requests for the caller that wait, or were declined.
  repeated ApiAccessRequest requests = 2;
  // The caller's single sign-on groups as last read, which they may offer
  // in a request; empty while their groups don't count (no group source,
  // an older single sign-on session, or Google's read over 90 minutes ago).
  repeated string groups = 3;
}

message ListTeamBotApiAccessRequest {
  string team = 1;
}

message ListTeamBotApiAccessResponse {
  // The team's bots' active grants.
  repeated ApiGrant grants = 1;
  // The team's bots' requests that wait, or were declined.
  repeated ApiAccessRequest requests = 2;
}

enum ApiState {
  API_STATE_UNSPECIFIED = 0;
  // The gateway forwards what its spec describes.
  API_STATE_LIVE = 1;
  // Its backend isn't under a host this install allows: the gateway
  // answers 503 and forwards nothing (held_reason says why).
  API_STATE_HELD = 2;
  // A maintainer paused it (paused_message).
  API_STATE_PAUSED = 3;
  // The gateway can't use its OpenAPI document (problem says why): it
  // answers 503 and forwards nothing until a release fixes it.
  API_STATE_UNAVAILABLE = 4;
}

message ApiProduct {
  string team = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
  ApiState state = 5;
  string held_reason = 6;
  string paused_message = 7;
  // Whether the caller may call it: their own team's, granted to them or a
  // group of theirs, or shared with one of their teams (access_via).
  bool may_call = 8;
  repeated string share_with = 9;
  bool hidden = 10;
  // Why it's deprecated, and what to use instead.
  string deprecated = 11;
  // Reachable from the internet: asked for in api.yaml, and allowed for its
  // team here.
  bool internet = 12;
  // Where to call it: the gateway's address and /<team>/<name>, inside the
  // cluster and, when reachable from the internet, from outside.
  string url = 13;
  string public_url = 14;
  // What its spec lets through.
  repeated ApiEndpoint endpoints = 15;
  // Requests a minute the caller may send (their grant's, or their team's
  // own limit, else the default); 0 when they may not call it.
  int32 per_minute = 16;
  int32 timeout_seconds = 17;
  int32 max_request_bytes = 18;
  // Its api.yaml in the catalog repository.
  string source_path = 19;
  // The API's own team only: where the gateway forwards to, and how it
  // signs in there (service_account_token, google_id_token or aws_sig_v4).
  string backend_url = 20;
  string backend_auth = 21;
  // The spec's title and version.
  string spec_title = 22;
  string spec_version = 23;
  // When the caller may not call it: a new issue on the catalog repository,
  // filled in with what to change, asking its team to share it (opened in
  // the person's own browser). Empty when it can't be built.
  string ask_for_access_url = 24;
  // Unavailable: what the gateway found, and when.
  string problem = 25;
  google.protobuf.Timestamp problem_found_at = 26;
  // Each team its api.yaml names a limit for, requests a minute; every
  // other team it's shared with gets default_per_minute: api.yaml's
  // default, else (default_from_gateway) the gateway's own.
  repeated TeamLimit limits = 27;
  int32 default_per_minute = 28;
  bool default_from_gateway = 29;
  // How the caller may call it (unspecified: they may not).
  ApiAccessVia access_via = 30;
  // api.yaml's access.requests: open, approval or closed.
  string access_requests = 31;
}

message TeamLimit {
  string team = 1;
  int32 per_minute = 2;
}

message ApiEndpoint {
  // GET, POST and so on.
  string method = 1;
  // As the spec writes it, such as /orders/{orderId}.
  string path = 2;
  string summary = 3;
}

message ListApisRequest {}

message ListApisResponse {
  repeated ApiProduct apis = 1;
}

message GetApiRequest {
  string team = 1;
  string name = 2;
}

message GetApiResponse {
  ApiProduct api = 1;
  // Its OpenAPI document, as JSON.
  string openapi = 2;
}

message PauseApiRequest {
  string team = 1;
  string name = 2;
  // What every caller is told until it's resumed. At most 500 characters.
  string message = 3;
}

message PauseApiResponse {}

message ResumeApiRequest {
  string team = 1;
  string name = 2;
}

message ResumeApiResponse {}

message GetApiTrafficRequest {
  string team = 1;
  string name = 2;
  // 24 when unset; at most 168.
  int32 hours = 3;
}

message GetApiTrafficResponse {
  int64 requests = 1;
  int64 forwarded = 2;
  // Answered by the gateway: not in the spec, unfit, over the rate, not
  // signed in or not shared, paused, held or closed.
  int64 stopped = 3;
  int64 backend_errors = 4;
  repeated EndpointTraffic endpoints = 5;
  repeated BlockedRequests blocked = 6;
  repeated TeamTraffic teams = 7;
}

message EndpointTraffic {
  // "METHOD /path/{param}", as its spec writes it.
  string endpoint = 1;
  int64 requests = 2;
  // Stopped by the gateway for not fitting the spec's schemas.
  int64 invalid = 3;
  int64 backend_4xx = 4;
  int64 backend_5xx = 5;
  // The backend's average answer time, in milliseconds.
  int64 average_ms = 6;
}

message BlockedRequests {
  // "METHOD /path" as sent (no query): what the spec doesn't describe.
  string request = 1;
  int64 count = 2;
  repeated string teams = 3;
  google.protobuf.Timestamp last = 4;
}

message TeamTraffic {
  // "" for callers who weren't signed in; "grant:user" for those a grant
  // names, "grant:group:<group>" for those a group's grant lets in (no
  // person is named; no team's name has a ":").
  string team = 1;
  int64 requests = 2;
  // Its busiest minute, against its limit.
  int64 peak_per_minute = 3;
  int32 limit_per_minute = 4;
}

message GetGatewayRequest {}

message GetGatewayResponse {
  bool enabled = 1;
  repeated string backend_hosts = 2;
  repeated string internet_teams = 3;
  string url = 4;
  string public_url = 5;
  // Closed by an admin, and why; empty when open.
  string closed_message = 6;
  string closed_by = 7;
  google.protobuf.Timestamp closed_at = 8;
  int32 apis = 9;
  int64 requests_24h = 10;
  // What it answered itself, without forwarding, over the last day.
  repeated RefusedRequests refused = 11;
}

message RefusedRequests {
  // blocked, invalid, limited, unauthenticated, forbidden, paused, held,
  // closed, unavailable, backend_error.
  string outcome = 1;
  int64 count = 2;
  // The team with the most of them.
  string mostly = 3;
}

message SetGatewayClosedRequest {
  // Empty reopens it. At most 500 characters.
  string message = 1;
}

message SetGatewayClosedResponse {}

message ListAwayApiAccessRequest {
  string team = 1;
}

message ListAwayApiAccessResponse {
  repeated ApiGrant grants = 1;
  repeated ApiAccessRequest requests = 2;
}

message ListAllApiGrantsRequest {
  // 100 when unset, at most 500.
  PageRequest page = 1;
}

message ListAllApiGrantsResponse {
  repeated ApiGrant grants = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // Every active grant, whatever the page: in all, and to groups, people
  // and bots.
  int32 total = 3;
  int32 groups = 4;
  int32 people = 5;
  int32 bots = 6;
  // Requests waiting for their APIs' teams, and on how many APIs.
  int32 waiting_requests = 7;
  int32 waiting_apis = 8;
}

{{/*
Where the console may write: only in team namespaces. Its ClusterRole has
to be cluster-wide (team namespaces aren't known in advance), so on its own
it would let the console create, change or delete Secrets, ServiceAccounts,
Roles, RoleBindings and ExternalSecrets in any namespace: kube-system, the
platform's own. This policy, applied by the Kubernetes API server to every
such request from the console's ServiceAccount, refuses anything outside a
namespace labelled as a team's (the label the kernel's dispatch policy uses),
but its NetworkPolicies in a team's API backends' namespace (<team>-apis,
labelled vennir/api-backends: console/src/teamNetwork.ts).

Inside a team namespace, which objects are the console's is its own rule
(console/src/k8s.ts: it labels what it creates, and replaces an existing
Secret only when it's labelled or already granted). For ExternalSecrets the
label is enforced here as well: it updates only one labelled as its own.
Secrets aren't held to the label here, because some the console rightly
replaces predate it (a registered secret from before labels, a
SecretStore's credential).
*/}}
{{- if .Values.writeFence.enabled }}
{{- $console := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "execution-console.serviceAccountName" .) }}
{{- $name := printf "%s-write-fence" (include "execution-console.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "serviceaccounts"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["externalsecrets", "secretstores"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["resourcequotas", "limitranges"]
  matchConditions:
    - name: from-the-console
      expression: request.userInfo.username == {{ $console | quote }}
  validations:
    # Outside team namespaces, only the NetworkPolicies of a team's API
    # backends' namespace (held to the shapes below), and the federated
    # registry token's Secret in this one (registryFederation.ts), when
    # that's configured.
    - expression: >-
        (has(namespaceObject.metadata.labels) &&
        {{ .Values.writeFence.teamNamespaceLabel | quote }} in namespaceObject.metadata.labels) || (
        namespaceObject.metadata.name.endsWith("-apis") && has(namespaceObject.metadata.labels) &&
        "vennir/api-backends" in namespaceObject.metadata.labels &&
        request.resource.group == "networking.k8s.io" && request.resource.resource == "networkpolicies")
        {{- if include "execution-console.registryFederationAudience" . }} || (
        request.namespace == {{ .Release.Namespace | quote }} && request.resource.resource == "secrets" &&
        request.operation != "DELETE" && object.metadata.name == "vennir-registry-token")
        {{- end }}
      messageExpression: >-
        "The console may only write in team namespaces (labelled " +
        {{ .Values.writeFence.teamNamespaceLabel | quote }} + "), and only NetworkPolicies in a team's API " +
        "backends' namespace, not this in " + request.namespace + "."
      reason: Forbidden
    # It creates product ServiceAccounts and never changes them afterwards
    # (a cloud identity bound to one is the platform team's); the only
    # ones it updates are ESO's, from a reviewed SecretStore file.
    - expression: >-
        request.resource.resource != "serviceaccounts" || request.operation != "UPDATE" ||
        object.metadata.name.startsWith("eso-")
      messageExpression: >-
        "The console may only update the ServiceAccounts ESO signs in as (eso-*), not " +
        object.metadata.name + "."
      reason: Forbidden
    # Its ExternalSecrets are its own: each it creates carries its label,
    # and it updates only one that already did (k8s.ts,
    # upsertExternalSecretGrant), so one made elsewhere is never taken over.
    - expression: >-
        request.resource.resource != "externalsecrets" || request.operation == "DELETE" || (
          has(object.metadata.labels) &&
          object.metadata.labels[?"app.kubernetes.io/managed-by"].orValue("") == "vennir-console" &&
          (request.operation != "UPDATE" || (
            has(oldObject.metadata.labels) &&
            oldObject.metadata.labels[?"app.kubernetes.io/managed-by"].orValue("") == "vennir-console")))
      message: >-
        The console's ExternalSecrets carry app.kubernetes.io/managed-by=vennir-console, and it may
        only update one that already did.
      reason: Forbidden
    # Its NetworkPolicies are each team's default deny (k8s.ts,
    # writeTeamNetworkPolicy), in its namespace and its API backends', never deleted, and only ever refusing more:
    # every Pod selected, and connections let in from this namespace's own
    # Pods alone, with no egress rule (NetworkPolicy allows add up, so one
    # would undo vennir-no-metadata). So the console can't open a team
    # namespace to anything outside it, except, with the gateway on, exactly
    # one opening: this release's gateway Pods to the Pods the team itself
    # labels vennir/api-backend=true. The no-metadata one may only let out
    # everything less the metadata server's address.
    {{- $gatewayIngress := and .Values.gateway.enabled .Values.teamNamespaces.manage .Values.teamNamespaces.defaultDenyIngress }}
    - expression: >-
        request.resource.resource != "networkpolicies" || (
          request.operation != "DELETE" && ((
          object.metadata.name == "vennir-default-deny" &&
          (!has(object.spec.podSelector.matchLabels) || size(object.spec.podSelector.matchLabels) == 0) &&
          !has(object.spec.podSelector.matchExpressions) &&
          object.spec.policyTypes == ["Ingress"] &&
          !has(object.spec.egress) &&
          (!has(object.spec.ingress) || object.spec.ingress.all(rule,
            has(rule.from) && size(rule.from) > 0 && rule.from.all(peer,
              has(peer.podSelector) && !has(peer.namespaceSelector) && !has(peer.ipBlock))))
          ){{ if $gatewayIngress }} || (
          object.metadata.name == "vennir-gateway-ingress" &&
          has(object.spec.podSelector.matchLabels) &&
          object.spec.podSelector.matchLabels == {"vennir/api-backend": "true"} &&
          !has(object.spec.podSelector.matchExpressions) &&
          object.spec.policyTypes == ["Ingress"] &&
          !has(object.spec.egress) &&
          has(object.spec.ingress) && size(object.spec.ingress) == 1 &&
          !has(object.spec.ingress[0].ports) &&
          has(object.spec.ingress[0].from) && size(object.spec.ingress[0].from) == 1 &&
          !has(object.spec.ingress[0].from[0].ipBlock) &&
          has(object.spec.ingress[0].from[0].namespaceSelector) &&
          has(object.spec.ingress[0].from[0].namespaceSelector.matchLabels) &&
          object.spec.ingress[0].from[0].namespaceSelector.matchLabels == {"kubernetes.io/metadata.name": {{ .Release.Namespace | quote }}} &&
          !has(object.spec.ingress[0].from[0].namespaceSelector.matchExpressions) &&
          has(object.spec.ingress[0].from[0].podSelector) &&
          has(object.spec.ingress[0].from[0].podSelector.matchLabels) &&
          object.spec.ingress[0].from[0].podSelector.matchLabels == {{ include "execution-console.gatewaySelectorLabels" . | fromYaml | toJson }} &&
          !has(object.spec.ingress[0].from[0].podSelector.matchExpressions)
          ){{ end }}{{ if .Values.teamNamespaces.blockMetadata }} || (
          object.metadata.name == "vennir-no-metadata" &&
          (!has(object.spec.podSelector.matchLabels) || size(object.spec.podSelector.matchLabels) == 0) &&
          !has(object.spec.podSelector.matchExpressions) &&
          object.spec.policyTypes == ["Egress"] &&
          !has(object.spec.ingress) &&
          has(object.spec.egress) && object.spec.egress.all(rule,
            !has(rule.ports) && has(rule.to) && rule.to.all(peer,
              has(peer.ipBlock) && !has(peer.podSelector) && !has(peer.namespaceSelector) &&
              peer.ipBlock.cidr == "0.0.0.0/0" &&
              has(peer.ipBlock.except) && "169.254.169.254/32" in peer.ipBlock.except))
          ){{ end }}))
      message: >-
        The console's NetworkPolicies are a team namespace's vennir-default-deny, selecting every
        Pod and letting in nothing from outside the namespace, and (with the gateway on)
        vennir-gateway-ingress, letting only the gateway's Pods reach the team's API backends, and
        (with teamNamespaces.blockMetadata) vennir-no-metadata, letting out everything but the
        metadata server (169.254.169.254); none but that one has an egress rule, and it never
        deletes one.
      reason: Forbidden
    # Its only RoleBinding written is each team namespace's
    # vennir-scheduler-logs (schedulerLogs.ts): the kernel's logs-only
    # ClusterRole for its scheduler, and nothing else; no Role ever. It may
    # still delete the per-secret ones older consoles made.
    {{- $logs := include "execution-console.schedulerLogs" . | fromJson }}
    - expression: >-
        request.operation == "DELETE" ||
        (request.resource.resource != "roles" && request.resource.resource != "rolebindings")
        {{- if $logs }} || (
        request.resource.resource == "rolebindings" &&
        object.metadata.name == "vennir-scheduler-logs" &&
        object.roleRef.apiGroup == "rbac.authorization.k8s.io" &&
        object.roleRef.kind == "ClusterRole" &&
        object.roleRef.name == {{ $logs.clusterRole | quote }} &&
        has(object.subjects) && size(object.subjects) == 1 &&
        object.subjects[0].kind == "ServiceAccount" &&
        object.subjects[0].name == {{ $logs.name | quote }} &&
        has(object.subjects[0].namespace) && object.subjects[0].namespace == {{ $logs.namespace | quote }})
        {{- end }}
      message: >-
        The console's only RBAC write is a team namespace's vennir-scheduler-logs RoleBinding,
        binding the kernel's logs-only ClusterRole to its scheduler alone.
      reason: Forbidden
    # Its only quota and limits are each team's (teamQuota.ts). (Deleting
    # one is checked by its name in the request: there's no object then.)
    - expression: >-
        (request.resource.resource != "resourcequotas" || request.name == "vennir-team-quota") &&
        (request.resource.resource != "limitranges" || request.name == "vennir-team-limits")
      message: >-
        The console's only ResourceQuota and LimitRange are a team namespace's vennir-team-quota
        and vennir-team-limits.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}

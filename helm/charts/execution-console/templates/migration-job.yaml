{{/*
Runs db/migrate.ts (Drizzle migrations, then the one-time bootstrap-admin
seed) before execution-console starts serving -- same reasoning as
execution-kernel's own migrate Job: Kubernetes has no native "wait for
another resource" primitive, so this leans on the Job's own backoffLimit
to ride out Postgres still starting on a fresh install, and on Helm
itself waiting for hook Jobs to reach Complete before the release is
considered finished.

Deliberately NOT "hook-succeeded" in the delete policy, unlike execution-
kernel's otherwise-identical migrate Job: confirmed directly, against a
real cluster, that a hook-succeeded Job (and the Pod it owns, along with
that Pod's logs) is gone essentially immediately after `helm install`
returns. Its log says whether this install created the first admin
(`vennir apply` reads that; never a password, which no log ever holds),
so the Job is kept until the *next* install/upgrade creates a new one.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "execution-console.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "execution-console.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- if .Values.database.iamAuth }}
      # Signs in to the database as the console does: its ServiceAccount's
      # cloud identity (it exists by then: the hook runs post-install).
      serviceAccountName: {{ include "execution-console.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- include "execution-console.podSecurityContext" . | nindent 8 }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- include "execution-console.tlsVolumes" . | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "execution-console.appImage" . | quote }}
          securityContext:
            {{- include "execution-console.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "execution-console.tlsMounts" . | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "execution-console.fullname" . }}-migrate-config
          env:
            {{- include "execution-console.ssoEnv" . | nindent 12 }}
            {{- include "execution-console.tlsEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-console.databaseSecretName" . }}
                  key: {{ include "execution-console.databaseSecretKey" . }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-console.secretName" . }}
                  key: jwt-secret
            {{- if .Values.gateway.enabled }}
            # The gateway's role: granted what it reads; made here (with this
            # password) on this chart's own Postgres, where this runs as its
            # superuser.
            - name: GATEWAY_DB_ROLE
              value: {{ .Values.gateway.database.role | quote }}
            {{- if and .Values.postgres.enabled (not .Values.gateway.database.existingSecret) }}
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-console.secretName" . }}
                  key: gateway-db-password
            {{- end }}
            {{- end }}
            {{- if .Values.bootstrapAdmin.existingSecret }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrapAdmin.existingSecret | quote }}
                  key: {{ .Values.bootstrapAdmin.existingSecretKey | quote }}
            {{- else if .Values.bootstrapAdmin.password }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-console.secretName" . }}
                  key: bootstrap-admin-password
            {{- end }}

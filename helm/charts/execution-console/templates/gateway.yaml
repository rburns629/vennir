{{/*
The API gateway (gateway/, decision 20): forwards to each API product's
backend exactly what its OpenAPI document describes. It reads this console's
database (published APIs, and who callers are), writing only api_traffic and
api_problems (its traffic counts, and why an API can't be served). It may
mint ServiceAccount tokens for API ServiceAccounts (*-api, in team
namespaces) and nothing else: its ClusterRole's one verb, fenced by the
admission policy below.
*/}}
{{- if .Values.gateway.enabled }}
{{- /* A trusted proxy's X-Forwarded-For is taken as who the caller is, so
only what reaches the public listener from those proxies alone may be one. */}}
{{- if and .Values.gateway.trustedProxies (not (and .Values.gateway.publicListener .Values.networkPolicy.enabled .Values.gateway.publicListenerFrom)) }}
{{- fail "gateway.trustedProxies needs gateway.publicListener, networkPolicy.enabled and gateway.publicListenerFrom: without them any Pod reaching the public listener from a trusted address could say it's anyone" }}
{{- end }}
{{- $name := printf "%s-gateway" (include "execution-console.fullname" .) }}
{{- $signing := printf "%s-signing" $name }}
{{- /* The Google service account it signs in to the database as, with IAM auth. */}}
{{- $dbAccount := "" }}
{{- if eq .Values.database.iamAuth "gcp" }}
{{- $dbAccount = index .Values.gateway.serviceAccountAnnotations "iam.gke.io/gcp-service-account" | default "" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $signing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $signing }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
  annotations:
    # Kept across upgrades and uninstalls: backends may have cached its
    # public key (/.vennir/jwks.json).
    helm.sh/resource-policy: keep
type: Opaque
data:
  # The Ed25519 seed Vennir-Caller is signed with: generated once.
  seed: {{ if $existing }}{{ index $existing.data "seed" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
  {{- with .Values.gateway.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
rules:
  # Tokens for API ServiceAccounts, for their backends' audiences
  # (backend.auth.serviceAccountToken): fenced below to *-api in team
  # namespaces.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
{{- /*
Which audiences each API's ServiceAccount may get a token for: exactly what
its published API needs the gateway to ask for (a serviceAccountToken
backend's audience; AWS STS's for awsSigV4; gateway.gcp.tokenAudience for
googleIdToken), and nothing for an API that's held, or whose team is
retired or purged. So a serviceAccountToken API's backend can't be handed a
token with an audience a cloud exchanges for that ServiceAccount's
identity, even though the gateway asks for such audiences for other APIs'
ServiceAccounts, and no API's ServiceAccount gets another API's audience.

The lists live in this policy itself, as CEL literals the console rewrites
whenever the catalog's APIs change, every few minutes and at startup
(console/src/gatewayTokenPolicy.ts; its RBAC allows updating this one
policy by name), as the kernel chart's identity policy holds the registered
products: `apiAudiences0` to `apiAudiencesf`, JSON maps of
"<namespace>/<serviceAccount>" to the list of its audiences, by the key's
length modulo 16 (a hex digit), since the API server compiles at most
100,000 characters per CEL expression (the console writes at most 95,000 a
map and 600,000 in all: gatewayTokenPolicy.ts's MAX_MAP_CHARS and
MAX_TOTAL_CHARS). This chart seeds them empty on install and keeps what's
there on upgrade (lookup), re-encoded as JSON so they can only ever be
literals; the console owns those fields under Helm 4's server-side apply,
so upgrades pass --force-conflicts. Until the console has written an API's
audiences (just published, the console not yet up), the gateway's mint is
refused, it answers that request 502 BACKEND_CREDENTIAL, and it asks again
on the next: it keeps no failed credential.
*/}}
{{- $tokensPolicy := printf "%s-tokens" $name }}
{{- $digits := splitList "" "0123456789abcdef" }}
{{- $shards := dict }}
{{- range $digits }}
{{- $_ := set $shards . dict }}
{{- end }}
{{- $existingPolicy := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $tokensPolicy }}
{{- if $existingPolicy }}
{{- range $existingPolicy.spec.variables }}
{{- $digit := trimPrefix "apiAudiences" .name }}
{{- if and (ne $digit .name) (hasKey $shards $digit) }}
{{- range $key, $audiences := fromJson .expression }}
{{- if not (and (regexMatch "^[a-z0-9-]+/[a-z0-9.-]+$" $key) (kindIs "slice" $audiences)) }}
{{- fail (printf "%s's apiAudiences%s isn't a JSON map of <namespace>/<serviceAccount> to lists of audiences; delete the policy and let the console resync it." $tokensPolicy $digit) }}
{{- end }}
{{- range $audiences }}
{{- if not (kindIs "string" .) }}
{{- fail (printf "%s's apiAudiences%s has an audience that isn't a string; delete the policy and let the console resync it." $tokensPolicy $digit) }}
{{- end }}
{{- end }}
{{- $_ := set (index $shards $digit) $key $audiences }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $tokensPolicy }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  matchConditions:
    - name: from-the-gateway
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace $name | quote }}
  variables:
    # The ones the console edits: the sixteen maps of each API
    # ServiceAccount's audiences.
    {{- range $digits }}
    - name: apiAudiences{{ . }}
      expression: {{ toJson (index $shards .) | toJson }}
    {{- end }}
    - name: apiAudiences
      expression: >-
        { {{- range $i, $digit := $digits }}{{ if $i }}, {{ end }}{{ $i }}: dyn(variables.apiAudiences{{ $digit }}){{ end -}} }
    - name: key
      expression: request.namespace + "/" + request.name
    - name: shard
      expression: variables.apiAudiences[size(variables.key) % 16]
    - name: allowedAudiences
      expression: >-
        variables.key in variables.shard ? variables.shard[variables.key] : []
  validations:
    - expression: >-
        request.name.endsWith("-api") && has(namespaceObject.metadata.labels) &&
        {{ .Values.writeFence.teamNamespaceLabel | quote }} in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels[{{ .Values.writeFence.teamNamespaceLabel | quote }}] == "true"
      messageExpression: >-
        "The gateway may only mint tokens for API ServiceAccounts (*-api) in active team namespaces, not " +
        request.namespace + "/" + request.name + "."
      reason: Forbidden
    # For a backend's audience: named (none means the Kubernetes API's own),
    # never the cluster's or kernel-api's, and short-lived (it asks for ten
    # minutes, gateway/internal/credentials). Nor Azure's federation audience
    # or a GKE pool's STS audience, which the gateway never asks for. AWS's
    # (sts.amazonaws.com) and the Google pool's or provider's
    # (gateway.gcp.tokenAudience) it does ask for, for its own exchanges
    # (awsSigV4, googleIdToken): the last validation allows those only for
    # the ServiceAccounts of APIs that use them. Kept as defence in depth.
    - expression: >-
        has(object.spec.audiences) && object.spec.audiences.size() > 0 &&
        object.spec.audiences.all(a, !(a in {{ concat (list "https://kubernetes.default.svc" "https://kubernetes.default.svc.cluster.local" "kubernetes.default.svc" "kubernetes.default.svc.cluster.local" .Values.kernelApiToken.audience) .Values.gateway.reservedAudiences | toJson }}) &&
          !a.startsWith("https://container.googleapis.com/") &&
          a.lowerAscii() != "api://azureadtokenexchange" && !a.lowerAscii().startsWith("identitynamespace:"))
      message: "The gateway mints tokens only for a backend's own audience: never the Kubernetes API's or kernel-api's, nor one a cloud federates that it doesn't use itself."
      reason: Forbidden
    - expression: has(object.spec.expirationSeconds) && object.spec.expirationSeconds <= 3600
      message: "The gateway mints tokens lasting an hour at most."
      reason: Forbidden
    # Only what its published API needs (this file's comment above).
    - expression: >-
        has(object.spec.audiences) && object.spec.audiences.all(a, a in variables.allowedAudiences)
      messageExpression: >-
        "The gateway mints tokens for " + variables.key + " only for the audiences its published API needs (" +
        (size(variables.allowedAudiences) == 0 ? "none: no published API runs as it" : variables.allowedAudiences.join(", ")) +
        "), not " + (has(object.spec.audiences) ? object.spec.audiences.join(", ") : "none") + "."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-tokens
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}-tokens
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "execution-console.gatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "execution-console.gatewaySelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ include "execution-console.image" (dict "repository" .Values.gateway.image.repository "tag" (.Values.gateway.image.tag | default .Chart.AppVersion) "digest" .Values.gateway.image.digest) | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 8080}
            {{- if .Values.gateway.publicListener }}
            - {name: public, containerPort: 8081}
            {{- end }}
            - {name: metrics, containerPort: 9090}
          env:
            # Its own role, granted only what it reads and the two tables it
            # writes, api_traffic and api_problems (gateway.database).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-console.gatewayDatabaseSecretName" . }}
                  key: {{ include "execution-console.gatewayDatabaseSecretKey" . }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.gateway.databaseMaxConnections | quote }}
            - name: DATABASE_CONNECT_TIMEOUT_SECONDS
              value: {{ .Values.databaseConnectTimeoutSeconds | quote }}
            - name: DATABASE_IAM_AUTH
              value: {{ .Values.database.iamAuth | quote }}
            - name: DATABASE_IAM_REGION
              value: {{ .Values.database.region | quote }}
            {{- with $dbAccount }}
            # Its database token federated from its own ServiceAccount
            # token: its NetworkPolicy keeps it from the metadata server.
            - name: DATABASE_IAM_ACCOUNT
              value: {{ . | quote }}
            - name: DATABASE_IAM_TOKEN_FILE
              value: /var/run/secrets/vennir/db-token/token
            {{- end }}
            # Sessions are checked with the console's public key (its JWKS,
            # GET /api/auth/jwks): the gateway never holds JWT_SECRET.
            - name: CONSOLE_URL
              value: "http://{{ include "execution-console.fullname" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain | default "cluster.local" }}:{{ .Values.service.port }}"
            - name: SIGNING_KEY_FILE
              value: /var/run/secrets/vennir/signing/seed
            - name: GATEWAY_ISSUER
              value: {{ .Values.gateway.publicUrl | default .Values.gateway.url | default (printf "http://%s.%s.svc.%s:8080" $name .Release.Namespace (.Values.clusterDomain | default "cluster.local")) | quote }}
            - name: BACKEND_HOSTS
              value: {{ join "," .Values.gateway.backendHosts | quote }}
            - name: CLUSTER_DOMAIN
              value: {{ .Values.clusterDomain | quote }}
            - name: INTERNET_TEAMS
              value: {{ join "," .Values.gateway.internetTeams | quote }}
            - name: TRUSTED_PROXIES
              value: {{ join "," .Values.gateway.trustedProxies | quote }}
            - name: DEFAULT_PER_MINUTE
              value: {{ .Values.gateway.defaultPerMinute | quote }}
            - name: UNAUTHENTICATED_PER_MINUTE
              value: {{ .Values.gateway.unauthenticatedPerMinute | quote }}
            # This chart's Ingress, untrusted, is every public caller's peer.
            - name: PUBLIC_PEERS_SHARED
              value: {{ or .Values.gateway.publicPeersShared (and .Values.gateway.publicListener .Values.gateway.ingress.enabled (not .Values.gateway.trustedProxies)) | quote }}
            - name: BODY_READ_TIMEOUT_SECONDS
              value: {{ .Values.gateway.bodyReadTimeoutSeconds | quote }}
            - name: CLOSED
              value: {{ .Values.gateway.closed | quote }}
            # A team may require single sign-on: then it refuses password
            # sessions, as the console does.
            - name: SSO_ENABLED
              value: {{ ternary "true" "false" (not (empty .Values.sso.issuer)) | quote }}
            - name: GCP_STS_AUDIENCE
              value: {{ .Values.gateway.gcp.stsAudience | quote }}
            - name: GCP_TOKEN_AUDIENCE
              value: {{ .Values.gateway.gcp.tokenAudience | quote }}
            {{- if .Values.gateway.publicListener }}
            - name: PUBLIC_LISTEN
              value: ":8081"
            {{- end }}
          # Up to ten minutes to start: on a fresh install it waits for the
          # console's migration to make its database role.
          startupProbe:
            httpGet: {path: /.vennir/health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /.vennir/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /.vennir/health, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: signing
              mountPath: /var/run/secrets/vennir/signing
              readOnly: true
            {{- if $dbAccount }}
            - {name: db-token, mountPath: /var/run/secrets/vennir/db-token, readOnly: true}
            {{- end }}
            {{- include "execution-console.tlsMounts" . | nindent 12 }}
      volumes:
        - name: signing
          secret:
            secretName: {{ $signing }}
        {{- if $dbAccount }}
        # For the cluster's Workload Identity pool, which Google's STS
        # exchanges; the kubelet keeps it fresh.
        - name: db-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ required "gateway.gcp.tokenAudience: the Workload Identity pool its database token is for" .Values.gateway.gcp.tokenAudience | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- include "execution-console.tlsVolumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "execution-console.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
    {{- if .Values.gateway.publicListener }}
    - {name: public, port: 8081, targetPort: public}
    {{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# What the gateway may connect to: DNS, and by default anywhere but the
# cloud metadata server, so a backend URL can't reach the node's
# credentials through it. Its callers may reach it from anywhere; its
# metrics port, only networkPolicy.metricsFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "execution-console.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
        {{- if and .Values.gateway.publicListener (not .Values.gateway.publicListenerFrom) }}
        - {port: 8081, protocol: TCP}
        {{- end }}
    {{- if and .Values.gateway.publicListener .Values.gateway.publicListenerFrom }}
    # The public listener, from its proxies only (gateway.publicListenerFrom):
    # what reaches it there may say who the caller is (trustedProxies).
    - from:
        {{- toYaml .Values.gateway.publicListenerFrom | nindent 8 }}
      ports:
        - {port: 8081, protocol: TCP}
    {{- end }}
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - {port: 9090, protocol: TCP}
    {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if .Values.gateway.egress }}
    - to:
        {{- toYaml .Values.gateway.egress | nindent 8 }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]
        - namespaceSelector: {}
    {{- end }}
{{- end }}
{{- if and .Values.gateway.publicListener .Values.gateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.gateway.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.gateway.ingress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: {name: public}
{{- end }}
{{- end }}

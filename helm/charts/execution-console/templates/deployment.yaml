apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "execution-console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-console.labels" . | nindent 4 }}
spec:
  # component: app on both the selector and the pod template is load-
  # bearing, not decorative: this chart also runs a bundled Postgres
  # Deployment (templates/postgres-deployment.yaml) sharing the same
  # name/instance labels, distinguished only by ITS OWN component:
  # postgres label. Without this, this Deployment's selector -- and
  # templates/service.yaml's -- would match both, and the Service would
  # silently round-robin roughly half of every request into the Postgres
  # pod's network namespace on a port nothing listens on there. Confirmed
  # the hard way: exactly that happened before this label was added.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "execution-console.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "execution-console.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        # kubectl logs (and vennir logs) read this one, not the init container.
        kubectl.kubernetes.io/default-container: execution-console
        # A ConfigMap change alone doesn't restart the Pods consuming it
        # via envFrom -- env vars are injected once at container start,
        # not live-reloaded. Without this, `helm upgrade` after only a
        # values.yaml/configmap.yaml change silently updates the
        # ConfigMap while the running Pod keeps its old env until someone
        # remembers a manual `kubectl rollout restart`. Confirmed the
        # hard way. Folding the rendered ConfigMap's content into an
        # annotation here changes the pod template hash whenever it
        # changes, so the Deployment controller rolls a fresh Pod
        # automatically, the same way a real image or resources change
        # already would.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Needs real Kubernetes API access -- see templates/rbac.yaml and
      # console/src/k8s.ts. Unlike execution-kernel's split (only the scheduler
      # gets one), there's only one workload here, and it's the one that
      # provisions Secrets/RBAC.
      securityContext:
        {{- include "execution-console.podSecurityContext" . | nindent 8 }}
      serviceAccountName: {{ include "execution-console.serviceAccountName" . }}
      # Copies on different nodes where there's a choice, so one node's
      # maintenance doesn't take them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "execution-console.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "execution-console.appImage" . | quote }}
          securityContext:
            {{- include "execution-console.containerSecurityContext" . | nindent 12 }}
          # Explicit, not left to default -- Kubernetes defaults an unset
          # imagePullPolicy to Always whenever the tag is "latest",
          # regardless of what's already on the node. Confirmed the hard
          # way: this container tried a live registry pull even with the
          # image already loaded locally (kind load docker-image) until
          # this was set.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "-e"]
          args:
            - |
              const net = require("net");
              const tryConnect = () => {
                const socket = net.createConnection(5432, process.env.POSTGRES_HOST, () => socket.end());
                socket.on("error", () => setTimeout(tryConnect, 2000));
              };
              tryConnect();
          env:
            - name: POSTGRES_HOST
              value: {{ include "execution-console.fullname" . }}-postgres
      {{- end }}
      containers:
        - name: execution-console
          image: {{ include "execution-console.appImage" . | quote }}
          securityContext:
            {{- include "execution-console.containerSecurityContext" . | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.monitoring.port }}
            - name: metrics
              containerPort: {{ .Values.monitoring.port }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "execution-console.fullname" . }}-config
          env:
            {{- include "execution-console.ssoEnv" . | nindent 12 }}
            {{- include "execution-console.tlsEnv" . | nindent 12 }}
            {{- with .Values.audit.export.credentialsSecret }}
            # An S3-compatible store's keys, for the audit log's copy.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: {{ . }}, key: access-key-id}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ . }}, key: secret-access-key}}
            {{- end }}
            {{- with .Values.chat.apiKeySecret }}
            # The chat model's key, when its provider needs one.
            - name: CHAT_API_KEY
              valueFrom: {secretKeyRef: {name: {{ . }}, key: api-key}}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-console.databaseSecretName" . }}
                  key: {{ include "execution-console.databaseSecretKey" . }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-console.secretName" . }}
                  key: jwt-secret
            {{- if .Values.registryCheck.pullSecretName }}
            - name: REGISTRY_AUTH_FILE
              value: /etc/vennir/registry/config.json
            {{- if .Values.registryCheck.copyToTeams }}
            - name: TEAM_PULL_SECRET_FILE
              value: /etc/vennir/registry/config.json
            {{- end }}
            {{- end }}
            - name: REGISTRY_GCP_METADATA_TOKEN
              value: {{ .Values.registryCheck.gcpMetadataToken | quote }}
            - name: REGISTRY_ECR_TOKEN
              value: {{ .Values.registryCheck.ecrToken | quote }}
            - name: REGISTRY_MIRRORS
              value: {{ $mirrors := list }}{{ range $host, $url := .Values.registryCheck.mirrors }}{{ $mirrors = append $mirrors (printf "%s=%s" $host $url) }}{{ end }}{{ join "," $mirrors | quote }}
            - name: IMAGE_PINNING
              value: {{ .Values.registryCheck.imagePinning | quote }}
            - name: GATEWAY_BACKEND_HOSTS
              value: {{ join "," .Values.gateway.backendHosts | quote }}
            - name: GATEWAY_INTERNET_TEAMS
              value: {{ join "," .Values.gateway.internetTeams | quote }}
            - name: GATEWAY_URL
              value: {{ .Values.gateway.url | quote }}
            - name: GATEWAY_PUBLIC_URL
              value: {{ .Values.gateway.publicUrl | quote }}
            - name: GATEWAY_DEFAULT_PER_MINUTE
              value: {{ .Values.gateway.defaultPerMinute | quote }}
            {{- if .Values.gateway.enabled }}
            # The gateway's token policy (gateway.yaml), whose audiences per
            # API ServiceAccount this console keeps current
            # (gatewayTokenPolicy.ts), and the audience the gateway's
            # googleIdToken exchanges ask for.
            - name: GATEWAY_TOKEN_POLICY_NAME
              value: {{ printf "%s-gateway-tokens" (include "execution-console.fullname" .) | quote }}
            - name: GATEWAY_GCP_TOKEN_AUDIENCE
              value: {{ .Values.gateway.gcp.tokenAudience | quote }}
            {{- end }}
            {{- if include "execution-console.registryFederationAudience" . }}
            {{- with .Values.registryCheck.gcpFederation }}
            {{- if .workloadIdentityProvider }}
            - name: REGISTRY_GCP_WIF_PROVIDER
              value: {{ .workloadIdentityProvider | quote }}
            - name: REGISTRY_GCP_SERVICE_ACCOUNT
              value: {{ .serviceAccount | quote }}
            - name: REGISTRY_FEDERATED_HOSTS
              value: {{ join "," .hosts | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.registryCheck.awsFederation }}
            {{- if .roleArn }}
            - name: REGISTRY_AWS_ROLE_ARN
              value: {{ .roleArn | quote }}
            - name: REGISTRY_FEDERATED_HOSTS
              value: {{ join "," .hosts | quote }}
            {{- end }}
            {{- end }}
            - name: REGISTRY_FEDERATION_TOKEN_FILE
              value: /var/run/secrets/vennir/registry/token
            - name: REGISTRY_TOKEN_SECRET
              value: vennir-registry-token
            {{- end }}
            {{- if .Values.kernelApiToken.enabled }}
            - name: KERNEL_API_TOKEN_FILE
              value: /var/run/secrets/vennir/kernel-api/token
            {{- end }}
          # Up to five minutes to start (its startup work, on a minimal
          # install's quarter of a CPU, took over a minute) before liveness,
          # which would otherwise restart it mid-start.
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.port }}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.port }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.port }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "execution-console.tlsMounts" . | nindent 12 }}
            {{- if .Values.kernelApiToken.enabled }}
            - name: kernel-api-token
              mountPath: /var/run/secrets/vennir/kernel-api
              readOnly: true
            {{- end }}
            {{- if .Values.registryCheck.pullSecretName }}
            - name: registry-auth
              mountPath: /etc/vennir/registry
              readOnly: true
            {{- end }}
            {{- if and .Values.notifications.email.host .Values.notifications.email.passwordSecret.name }}
            - name: smtp-password
              mountPath: /var/run/secrets/vennir/smtp
              readOnly: true
            {{- end }}
            {{- if include "execution-console.registryFederationAudience" . }}
            - name: registry-federation-token
              mountPath: /var/run/secrets/vennir/registry
              readOnly: true
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- include "execution-console.tlsVolumes" . | nindent 8 }}
        {{- if .Values.kernelApiToken.enabled }}
        # This Pod's ServiceAccount token, issued for kernel-api only (its
        # audience), so it's no use against the Kubernetes API or anything
        # else. The kubelet rotates it before it expires.
        - name: kernel-api-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.kernelApiToken.audience | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- with include "execution-console.registryFederationAudience" . }}
        # This Pod's ServiceAccount token, issued for the other side only (its
        # audience: Google's Workload Identity provider, or AWS STS):
        # exchanged there for a registry token, and no use against the
        # Kubernetes API.
        - name: registry-federation-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ . | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- with .Values.notifications.email }}
        {{- if and .host .passwordSecret.name }}
        # The SMTP server's password, as a file only the console reads.
        - name: smtp-password
          secret:
            secretName: {{ .passwordSecret.name }}
            items:
              - key: {{ .passwordSecret.key }}
                path: password
        {{- end }}
        {{- end }}
        {{- if .Values.registryCheck.pullSecretName }}
        # Not optional: a configured but missing credential should fail
        # the rollout, not quietly turn every check into "unverified".
        - name: registry-auth
          secret:
            secretName: {{ .Values.registryCheck.pullSecretName }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}

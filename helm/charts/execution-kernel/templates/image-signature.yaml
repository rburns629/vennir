{{/*
Images from the source registry only run if catalog CI signed them, which it
does after they pass its security scans. This closes the gap the image
allowlist (image-policy.yaml) can't: anyone with push access to the source
registry -- a project editor, a Cloud Build job -- could otherwise publish
an image that never went through CI and have it run.

Verified by Sigstore's policy-controller, which must already be installed
(a cluster-wide component, installed once, see docs; its webhook is scoped
to namespaces labelled with dispatchPolicy.teamNamespaceLabel). This chart
only adds the policy: which images need a signature, and who may have made
it: public keys (a generated key pair, or a cloud KMS key; verification
needs only the public half, never the signing key or the cloud it lives
in), and/or catalog CI's own identity (keyless). Nothing here is specific
to one cloud: policy-controller runs on any cluster (GKE, EKS, AKS, kind
with a reachable registry).

The kernel reports a refusal as a non-retryable IMAGE_NOT_SIGNED.

Careful where policy-controller's webhook reaches: in every namespace it
covers, it refuses ANY image it can't resolve to a digest, signed or not.
So its identity must be able to read every registry used there, and a
namespace the platform's own components run in must stay out of its scope
(see helm/values/gke/policy-controller.yaml).

Under policy-controller's default no-match-policy, deny, which vennir keeps,
a Pod whose image no policy covers is refused too: in team namespaces only
signed images from the source registry run, whoever makes the Pod, a bound
even a compromised console can't move. So images from the other allowed
sources (imagePolicy.additionalSources, or added on the Admin page) don't
run where signing is required. Only Pods are checked (below); a second
policy passes the workloads that make them.
*/}}
{{- if .Values.imageSignature.enabled }}
{{- if not (.Capabilities.APIVersions.Has "policy.sigstore.dev/v1beta1/ClusterImagePolicy") }}
{{- fail "imageSignature.enabled needs Sigstore's policy-controller installed first (it provides the ClusterImagePolicy CRD): helm install policy-controller sigstore/policy-controller -n cosign-system --create-namespace, with webhook.namespaceSelector set to the team namespace label (see docs)." }}
{{- end }}
{{- $keyless := .Values.imageSignature.keyless }}
{{- if and $keyless.issuer (not $keyless.subjectRegExp) }}
{{- fail "imageSignature.keyless needs subjectRegExp with issuer: which workflow's identity may sign (anyone can get a signature from the public issuer)." }}
{{- end }}
{{- if not (or .Values.imageSignature.publicKeys $keyless.issuer) }}
{{- fail "imageSignature.enabled needs a way to verify: imageSignature.publicKeys (PEM: a generated cosign.pub, or a KMS key's from `cosign public-key --key <kms uri>`) or imageSignature.keyless (catalog CI's OIDC identity)." }}
{{- end }}
{{- $images := .Values.imageSignature.images }}
{{- if not $images }}
{{- $source := .Values.imagePolicy.sourceRegistry | trim | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}
{{- if not $source }}
{{- fail "imageSignature.enabled needs imageSignature.images, or imagePolicy.sourceRegistry to derive it from." }}
{{- end }}
{{- $images = list (printf "%s/**" $source) }}
{{- end }}
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: {{ include "execution-kernel.fullname" . }}-signed-images
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  images:
    {{- range $images }}
    - glob: {{ . | quote }}
    {{- end }}
  # Pods only, not the Jobs that make them: each image is verified once, and
  # the scheduler's Job creation no longer waits on a verification (on GKE it
  # waited out the webhook's 10 s timeout, holding a pass); the webhook still
  # admits the Job, without fetching a signature. A refused Pod is its Job's
  # FailedCreate event, which the kernel reads as IMAGE_NOT_SIGNED.
  match:
    - group: ""
      version: v1
      resource: pods
  # Any one of these keys is enough, so a rotation lists the old and new key
  # until every published image is signed with the new one.
  authorities:
    {{- range $i, $key := .Values.imageSignature.publicKeys }}
    - name: key-{{ $i }}
      key:
        data: |
          {{- $key | trim | nindent 10 }}
    {{- end }}
    {{- if $keyless.issuer }}
    # Keyless: a certificate Fulcio issued to catalog CI's own OIDC identity
    # (this issuer, a subject matching subjectRegExp: the publish workflow on
    # main), with the signature in Rekor's transparency log.
    - name: catalog-ci-keyless
      keyless:
        url: {{ $keyless.fulcioUrl | quote }}
        identities:
          - issuer: {{ $keyless.issuer | quote }}
            subjectRegExp: {{ $keyless.subjectRegExp | quote }}
      ctlog:
        url: {{ $keyless.rekorUrl | quote }}
    {{- end }}
---
# The workloads that make Pods pass without being verified (the webhook still
# admits them, with no signature fetched): their Pods are what the policy
# above checks. Without this, under no-match-policy deny, a Job
# (and an API backend's Deployment) would match no policy and be refused.
# Never Pods: a policy passing them would let any image through.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: {{ include "execution-kernel.fullname" . }}-workloads-pass
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  images:
    - glob: "**"
  match:
    - {group: batch, version: v1, resource: jobs}
    - {group: batch, version: v1, resource: cronjobs}
    - {group: apps, version: v1, resource: deployments}
    - {group: apps, version: v1, resource: replicasets}
    - {group: apps, version: v1, resource: statefulsets}
    - {group: apps, version: v1, resource: daemonsets}
  authorities:
    - static:
        action: pass
{{- end }}

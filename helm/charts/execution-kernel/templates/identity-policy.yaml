{{/*
Which ServiceAccount a step may run as, and which Secrets it may mount: the
cluster's copy of the console's rule (identityRefusal in console/src/core/
executions.ts), so it holds even for a Job the console never checked.

A step runs as "default" with no Secrets, unless it runs a registered
product's release: then it may run as the ServiceAccount its product.yaml
declares and mount any Secret its team registered in the console (a team's
secrets are its products', chosen per step; a Secret nobody registered, such
as a SecretStore's credentials, can't be mounted at all). A product matches
when the step is in the product's team namespace (or the product belongs to
the platform, team ""), runs one of the product's released digests (from the
same image repository: never another image pushed there, at any tag or
digest) and the same action (the container's first argument). No step runs as one of
the ServiceAccounts ESO reads a team's vault as (eso-gcp, eso-aws,
eso-azure), whatever is registered: the console refuses them as a product's
too (console/src/core/products.ts). Anything else is refused
when the scheduler creates the Job, which the kernel reports as a
non-retryable IDENTITY_NOT_ALLOWED.

Without this, only the console enforced it: anything that got a Job created
another way could run as any product's ServiceAccount in that namespace and
mount any Secret there (the kubelet mounts whatever a Pod names; RBAC
doesn't apply to mounts).

A step may also get a short-lived ServiceAccount token for another cloud
(a projected token with an audience; OIDC federation), but only for an
audience its product declared (product.yaml's tokenAudiences), lasting an
hour at most. A projected token with no audience is the Kubernetes API's
own, which the kernel never asks for (it turns automounting off, unless
scheduler.taskPodHardening is off).

What's registered lives in this policy itself, as CEL literals the console
rewrites whenever products or secrets change, every few minutes and at
startup (console/src/productPolicy.ts; its RBAC allows updating this one
policy by name):
  - `releases0` to `releasesf`: JSON maps of a released digest
    (sha256:<64 hex>) to the products it's a release of, each {team,
    repository, action, serviceAccount, audiences} (audiences
    comma-separated, "" for none), by the digest's first hex digit; and
    `releases`, each digit to its map, so a lookup is a map index however
    many it holds. Which releases: each product's current one, and an
    earlier one while it's in use (run by an execution the console hasn't
    seen finish, or registered or run in the last hour). The rest are
    pruned: a step of one runs as an unregistered image would.
  - `teamSecrets`, a JSON map of team to its registered Secret names,
    comma-separated (CEL wants every value in a literal to have one type;
    Secret names can't contain commas).
  - `products`, the list charts before released digests held: {team,
    repository, action, serviceAccount, audiences}, matched by repository,
    any digest. Seeded [] on install. On an upgrade from such a chart it's
    kept, so steps keep running while consoles from before (which write
    only it) may still be taking submissions; the new console keeps it for
    its first ten minutes, then writes it [], and never fills it.

Size: the API server compiles at most 100,000 characters per CEL
expression. An entry is about 75 characters for its digest and about 150
for each product (action) it's a release of; the console writes at most
95,000 in any one map and 600,000 in all (about 2,600 digest-action pairs;
productPolicy.ts's MAX_MAP_CHARS, MAX_RELEASE_CHARS), keeping the object
well under etcd's 1.5 MiB and Helm's release Secret under its 1 MiB.

This chart seeds the literals empty on install and keeps whatever is there
on upgrade (lookup), re-encoded as JSON so they can only ever be literals.
Same reasoning as image-policy.yaml for a literal rather than a ConfigMap.

The kernel's Jobs have exactly one container and mount Secrets only as
volumes; anything else is refused too, so a Secret can't arrive some other
way unchecked. Images are read the way image-policy.yaml (and the console's
imageRepository) read them.
*/}}
{{- if .Values.identityPolicy.enabled }}
{{- $scheduler := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "execution-kernel.serviceAccountName" .) }}
{{- $name := printf "%s-identity" (include "execution-kernel.fullname" .) }}
{{- $productsExpr := "[]" }}
{{- $teamSecretsExpr := "{}" }}
{{- $digits := splitList "" "0123456789abcdef" }}
{{- $shards := dict }}
{{- range $digits }}
{{- $_ := set $shards . dict }}
{{- end }}
{{- $existing := lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicy" "" $name }}
{{- if $existing }}
{{- range $existing.spec.variables }}
{{- if eq .name "products" }}
{{- $kept := list }}
{{- range fromJsonArray .expression }}
{{- $entry := . }}
{{- if or (not (kindIs "map" $entry)) (not (and (kindIs "string" (get $entry "team")) (kindIs "string" (get $entry "repository")) (kindIs "string" (get $entry "action")) (kindIs "string" (get $entry "serviceAccount")))) (and (hasKey $entry "audiences") (not (kindIs "string" (get $entry "audiences")))) }}
{{- fail (printf "%s's products list isn't a JSON list of {team, repository, action, serviceAccount, audiences} strings; delete the policy and let the console resync it." $name) }}
{{- end }}
{{- /* Only these five (an older console also wrote each product's secrets,
     and none wrote audiences). */}}
{{- $kept = append $kept (dict "team" $entry.team "repository" $entry.repository "action" $entry.action "serviceAccount" $entry.serviceAccount "audiences" (default "" (get $entry "audiences"))) }}
{{- end }}
{{- $productsExpr = toJson $kept }}
{{- end }}
{{- if eq .name "teamSecrets" }}
{{- $stored := fromJson .expression }}
{{- range $team, $names := $stored }}
{{- if not (kindIs "string" $names) }}
{{- fail (printf "%s's teamSecrets isn't a JSON map of team to comma-separated Secret names; delete the policy and let the console resync it." $name) }}
{{- end }}
{{- end }}
{{- $teamSecretsExpr = toJson $stored }}
{{- end }}
{{- $digit := trimPrefix "releases" .name }}
{{- if and (ne $digit .name) (hasKey $shards $digit) }}
{{- range $digest, $entries := fromJson .expression }}
{{- if not (and (regexMatch "^sha256:[a-f0-9]{64}$" $digest) (eq (substr 7 8 $digest) $digit) (kindIs "slice" $entries)) }}
{{- fail (printf "%s's releases%s isn't a JSON map of sha256 digests starting %s to lists of products; delete the policy and let the console resync it." $name $digit $digit) }}
{{- end }}
{{- $kept := list }}
{{- range $entries }}
{{- $entry := . }}
{{- if or (not (kindIs "map" $entry)) (not (and (kindIs "string" (get $entry "team")) (kindIs "string" (get $entry "repository")) (kindIs "string" (get $entry "action")) (kindIs "string" (get $entry "serviceAccount")) (kindIs "string" (get $entry "audiences")))) }}
{{- fail (printf "%s's releases%s has a product that isn't {team, repository, action, serviceAccount, audiences} strings; delete the policy and let the console resync it." $name $digit) }}
{{- end }}
{{- $kept = append $kept (dict "team" $entry.team "repository" $entry.repository "action" $entry.action "serviceAccount" $entry.serviceAccount "audiences" $entry.audiences) }}
{{- end }}
{{- $_ := set (index $shards $digit) $digest $kept }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  matchConditions:
    - name: from-kernel-scheduler
      expression: request.userInfo.username == {{ $scheduler | quote }}
  variables:
    # The ones the console edits: the legacy products list, teamSecrets
    # and the sixteen releases maps.
    - name: products
      expression: {{ $productsExpr | toJson }}
    - name: teamSecrets
      expression: {{ $teamSecretsExpr | toJson }}
    {{- range $digits }}
    - name: releases{{ . }}
      expression: {{ toJson (index $shards .) | toJson }}
    {{- end }}
    - name: releases
      expression: >-
        { {{- range $i, $digit := $digits }}{{ if $i }}, {{ end }}{{ $digit | quote }}: dyn(variables.releases{{ $digit }}){{ end -}} }
    - name: pod
      expression: object.spec.template.spec
    - name: serviceAccount
      expression: >-
        has(variables.pod.serviceAccountName) && variables.pod.serviceAccountName != "" ?
          variables.pod.serviceAccountName : "default"
    - name: secrets
      expression: >-
        has(variables.pod.volumes) ?
          variables.pod.volumes.filter(v, has(v.secret)).map(v, v.secret.secretName) : []
    # Any other way of reaching a Secret; the kernel never uses one.
    - name: otherSecretRefs
      expression: >-
        (has(variables.pod.volumes) && variables.pod.volumes.exists(v,
          has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s, has(s.secret)))) ||
        variables.pod.containers.exists(c,
          (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef))) ||
          (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef))))
    - name: image
      expression: variables.pod.containers[0].image
    - name: normalizedImage
      expression: >-
        (variables.image.contains("/") && (variables.image.split("/")[0].contains(".") ||
          variables.image.split("/")[0].contains(":") || variables.image.split("/")[0] == "localhost" ||
          variables.image.split("/")[0].matches("[A-Z]"))) ?
          variables.image :
          (variables.image.contains("/") ? "docker.io/" + variables.image : "docker.io/library/" + variables.image)
    # The digest, then the tag, come off: the console pins images as
    # repo:tag@sha256:… (the same steps as console/src/imageRef.ts).
    - name: unpinnedImage
      expression: >-
        variables.normalizedImage.contains("@") ? variables.normalizedImage.split("@")[0] :
          variables.normalizedImage
    - name: repository
      expression: >-
        variables.unpinnedImage.lastIndexOf(":") > variables.unpinnedImage.lastIndexOf("/") ?
          variables.unpinnedImage.substring(0, variables.unpinnedImage.lastIndexOf(":")) :
          variables.unpinnedImage
    - name: action
      expression: >-
        has(variables.pod.containers[0].args) && size(variables.pod.containers[0].args) > 0 ?
          variables.pod.containers[0].args[0] : ""
    # The image's digest, "" when it isn't pinned to one.
    - name: digest
      expression: >-
        variables.normalizedImage.contains("@") &&
          variables.normalizedImage.split("@")[1].matches("^sha256:[a-f0-9]{64}$") ?
          variables.normalizedImage.split("@")[1] : ""
    # The products the digest is a release of, and (an upgraded install's,
    # until the console empties it) the legacy list's.
    - name: candidates
      expression: >-
        (variables.digest != "" && variables.digest in variables.releases[variables.digest.substring(7, 8)] ?
          variables.releases[variables.digest.substring(7, 8)][variables.digest] : []) +
        variables.products
    # The registered products' releases this step is.
    - name: matched
      expression: >-
        variables.candidates.filter(p,
          (p.team == "" || p.team == request.namespace) &&
          p.repository == variables.repository && p.action == variables.action &&
          p.serviceAccount == variables.serviceAccount)
    # Every projected token that names an audience (one with none is the
    # Kubernetes API's: automounting's, governed by taskPodHardening).
    - name: tokens
      expression: >-
        has(variables.pod.volumes) ?
          variables.pod.volumes.filter(v, has(v.projected) && has(v.projected.sources) &&
            v.projected.sources.exists(s, has(s.serviceAccountToken) &&
              has(s.serviceAccountToken.audience) && s.serviceAccountToken.audience != "")) : []
  validations:
    - expression: >-
        size(variables.pod.containers) == 1 && !has(variables.pod.initContainers) &&
        !variables.otherSecretRefs
      message: >-
        IDENTITY_NOT_ALLOWED: a step's Job must have exactly one container and
        mount Secrets only as volumes.
      reason: Forbidden
    - expression: >-
        !(variables.serviceAccount in ["eso-gcp", "eso-aws", "eso-azure"])
      messageExpression: >-
        "IDENTITY_NOT_ALLOWED: no step runs as " + variables.serviceAccount + ", the ServiceAccount " +
        "ESO reads team " + request.namespace + "'s vault as."
      reason: Forbidden
    - expression: >-
        (variables.serviceAccount == "default" && size(variables.secrets) == 0) ||
        size(variables.matched) > 0
      messageExpression: >-
        "IDENTITY_NOT_ALLOWED: " + variables.image + " (action \"" + variables.action +
        "\") may not run as ServiceAccount \"" + variables.serviceAccount + "\"" +
        (size(variables.secrets) > 0 ? " with Secrets" : "") +
        " in " + request.namespace + ". Only a registered product's release may (one of the " +
        "digests it's registered at, while in use), as the ServiceAccount its product.yaml " +
        "declares; anything else, another image of the same repository included, runs as " +
        "\"default\" with no Secrets."
      reason: Forbidden
    - expression: >-
        size(variables.secrets) == 0 ||
        (request.namespace in variables.teamSecrets &&
          variables.secrets.all(s, s in variables.teamSecrets[request.namespace].split(",")))
      messageExpression: >-
        "IDENTITY_NOT_ALLOWED: Secrets " + variables.secrets.join(", ") + " aren't all registered " +
        "for team " + request.namespace + " in the console; only registered secrets may be mounted."
      reason: Forbidden
    - expression: >-
        variables.tokens.all(v, v.projected.sources.all(s, !has(s.serviceAccountToken) ||
          !has(s.serviceAccountToken.audience) || s.serviceAccountToken.audience == "" ||
          ((!has(s.serviceAccountToken.expirationSeconds) || s.serviceAccountToken.expirationSeconds <= 3600) &&
            variables.matched.exists(p, s.serviceAccountToken.audience in p.audiences.split(",")))))
      messageExpression: >-
        "IDENTITY_NOT_ALLOWED: " + variables.repository + " (action \"" + variables.action +
        "\") may not have a ServiceAccount token for an audience its product didn't declare " +
        "(product.yaml's tokenAudiences), or one lasting over an hour, in " + request.namespace + "."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  # Team namespaces only, as for image-policy.yaml.
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: {{ .Values.dispatchPolicy.teamNamespaceLabel | quote }}
          operator: Exists
  validationActions: [Deny]
{{- end }}

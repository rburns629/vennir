{{/*
Restricts where kernel-scheduler can dispatch tasks: only into namespaces
explicitly labelled as team namespaces, never into this release's own.

A task's `team` field *is* the namespace its Job lands in, and the
scheduler's ClusterRole can create Jobs in any namespace (see rbac.yaml).
Without this, a task naming `kube-system`, or the namespace this platform
itself runs in, would be dispatched there under whatever ServiceAccount the
task named. The console checks team membership, and kernel-api accepts only the
console, but anything that can create Jobs directly (or a compromised
console) shouldn't be able to either, so the cluster enforces it too.

Enforced by the Kubernetes API server itself (a ValidatingAdmissionPolicy,
GA since Kubernetes 1.30), not by kernel code: it holds on any conformant
cluster, and it holds even for a submission that reached kernel-api
without going through the console.

Scoped to requests made by this release's scheduler ServiceAccount only, so
it never affects anything else in the cluster -- including the kernel's own
integration tests, which create Jobs as the developer's kubeconfig user.
Covers ConfigMaps as well as Jobs, the two things the scheduler's executor
creates (the Job, then its request.json ConfigMap), so the scheduler can't
create either in a namespace a task doesn't belong in. It deletes them too
(cancelling, cleaning up), so deleting is fenced the same way: only its own
(labelled app=execution-kernel, named ek-...), only in a team namespace,
retired ones included (a retired team's running steps still finish and are
cleaned up). Its ClusterRole would otherwise let it delete any Job or
ConfigMap in the cluster. The one change it may make to a Job is resuming
it: the executor creates each suspended, makes its request ConfigMap, then
resumes it, so its Pod never mounts a ConfigMap planted ahead of it. Only
its own, suspended, in a live team namespace, and nothing else changed.

A Job's Pod is held to the shape the executor gives it: its volumes only
its request ConfigMap (under the Job's own name), emptyDirs, Secrets and
projected tokens; no pull Secret but scheduler.taskImagePullSecret; placed
only as scheduler.taskPlacement or a capacityPlacements entry places steps,
on no node named. These come from this chart's values, so change them with
a chart upgrade, not only the scheduler's ConfigMap.
helm/tests/step-job.json is the executor's own Job (a kernel test keeps it
so), which the admission tests admit.

A Job must also be hardened as the executor makes it
(kernel/internal/executor/kubernetes.go), always: no Kubernetes token,
non-root, no privilege escalation, a read-only root filesystem, no
capabilities, nothing of the host's. The cluster then holds this even in a
team namespace without Pod Security's restricted label (one the console
didn't create), and for a Job the scheduler was tricked into making.

The platform's namespace is never a team's, so there's no setting that lets
steps run in it (dispatchPolicy.allowReleaseNamespace, removed: install the
platform into a namespace of its own, docs/operations.md, "Moving the
platform out of a team's namespace"). Set true, it stops the install;
false, as older vennir releases write it, is what the chart does anyway.
*/}}
{{- if .Values.dispatchPolicy.allowReleaseNamespace }}
{{- fail "dispatchPolicy.allowReleaseNamespace was removed: the platform's namespace is never a team's. Install into a namespace of its own (docs/operations.md, \"Moving the platform out of a team's namespace\") and drop the setting." }}
{{- end }}
{{- if .Values.dispatchPolicy.enabled }}
{{- $scheduler := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "execution-kernel.serviceAccountName" .) }}
{{- $label := .Values.dispatchPolicy.teamNamespaceLabel }}
{{- $pullSecret := .Values.scheduler.taskImagePullSecret | default "" }}
{{- /* Where the executor places a step: the install's placement, or a
       capacity's, each replacing the other (kernel/internal/executor). */}}
{{- $selectors := list (.Values.scheduler.taskPlacement.nodeSelector | default dict) }}
{{- $placed := .Values.scheduler.taskPlacement.tolerations | default list }}
{{- range $kind, $p := .Values.scheduler.capacityPlacements }}
{{- $selectors = append $selectors ($p.nodeSelector | default dict) }}
{{- $placed = concat $placed ($p.tolerations | default list) }}
{{- end }}
{{- $tolerations := list }}
{{- range $placed }}
{{- $tolerations = append $tolerations (join "|" (list (toString (.key | default "")) (toString (.operator | default "")) (toString (.value | default "")) (toString (.effect | default "")) (ternary (toString .tolerationSeconds) "" (hasKey . "tolerationSeconds")))) }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "execution-kernel.fullname" . }}-dispatch
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["configmaps"]
  matchConditions:
    - name: from-kernel-scheduler
      expression: request.userInfo.username == {{ $scheduler | quote }}
  variables:
    - name: labelled
      expression: >-
        has(namespaceObject.metadata.labels) &&
        {{ $label | quote }} in namespaceObject.metadata.labels
  validations:
    # Creating: only into a team namespace that isn't retired.
    - expression: >-
        request.operation != "CREATE" || (
        namespaceObject.metadata.name != {{ .Release.Namespace | quote }} &&
        variables.labelled &&
        namespaceObject.metadata.labels[{{ $label | quote }}] == "true")
      # A retired team's says so, with its code (the kernel reads it).
      messageExpression: >-
        variables.labelled && namespaceObject.metadata.labels[{{ $label | quote }}] == "retired"
        ? "TEAM_RETIRED: team " + namespaceObject.metadata.name + " is retired, so nothing
        new runs in its namespace; an admin can un-retire it"
        : "namespace " + namespaceObject.metadata.name + " is not a Vennir team
        namespace (it needs the label {{ $label }}=true), so tasks can't be
        dispatched into it"
      reason: Forbidden
    # Deleting: only what the executor made, in a team namespace, live or retired.
    - expression: >-
        request.operation != "DELETE" || (
        namespaceObject.metadata.name != {{ .Release.Namespace | quote }} &&
        variables.labelled &&
        namespaceObject.metadata.labels[{{ $label | quote }}] in ["true", "retired"] &&
        oldObject.metadata.name.startsWith("ek-") &&
        has(oldObject.metadata.labels) && "app" in oldObject.metadata.labels &&
        oldObject.metadata.labels["app"] == "execution-kernel")
      messageExpression: >-
        "the scheduler may delete only its own Jobs and ConfigMaps, in team
        namespaces; not " + oldObject.metadata.name + " in " + namespaceObject.metadata.name
      reason: Forbidden
    # Updating: only resuming its own suspended Job, in a team namespace
    # that isn't retired, with nothing else changed (what the Pod runs, as
    # whom, with what, was checked when the Job was created).
    - expression: >-
        request.operation != "UPDATE" || (
        namespaceObject.metadata.name != {{ .Release.Namespace | quote }} &&
        variables.labelled &&
        namespaceObject.metadata.labels[{{ $label | quote }}] == "true" &&
        oldObject.metadata.name.startsWith("ek-") &&
        has(oldObject.metadata.labels) && "app" in oldObject.metadata.labels &&
        oldObject.metadata.labels["app"] == "execution-kernel" &&
        has(oldObject.spec.suspend) && oldObject.spec.suspend == true &&
        has(object.spec.suspend) && object.spec.suspend == false &&
        object.spec.template == oldObject.spec.template &&
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}) == (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        (has(object.spec.parallelism) ? object.spec.parallelism : -1) == (has(oldObject.spec.parallelism) ? oldObject.spec.parallelism : -1) &&
        (has(object.spec.completions) ? object.spec.completions : -1) == (has(oldObject.spec.completions) ? oldObject.spec.completions : -1) &&
        (has(object.spec.activeDeadlineSeconds) ? object.spec.activeDeadlineSeconds : -1) == (has(oldObject.spec.activeDeadlineSeconds) ? oldObject.spec.activeDeadlineSeconds : -1) &&
        (has(object.spec.ttlSecondsAfterFinished) ? object.spec.ttlSecondsAfterFinished : -1) == (has(oldObject.spec.ttlSecondsAfterFinished) ? oldObject.spec.ttlSecondsAfterFinished : -1) &&
        (has(object.spec.backoffLimit) ? object.spec.backoffLimit : -1) == (has(oldObject.spec.backoffLimit) ? oldObject.spec.backoffLimit : -1))
      messageExpression: >-
        variables.labelled && namespaceObject.metadata.labels[{{ $label | quote }}] == "retired"
        ? "TEAM_RETIRED: team " + namespaceObject.metadata.name + " is retired, so nothing
        new runs in its namespace; an admin can un-retire it"
        : "the scheduler may only resume its own suspended Jobs, in team namespaces,
        changing nothing else; not " + oldObject.metadata.name + " in " + namespaceObject.metadata.name
      reason: Forbidden
    # A step's container, exactly as the executor makes it: its image's own
    # entrypoint (no command, hook, probe or init container), the action as
    # its one argument, and no
    # environment but the install's taskExtraEnvironment, as values; and
    # every projected token for an audience it names (one with none is the
    # Kubernetes API's). So a Job can't run other code as a product's
    # identity with its Secrets, or carry a token for the cluster itself.
    - expression: >-
        request.operation != "CREATE" || request.resource.resource != "jobs" || (
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.size() == 0) &&
        object.spec.template.spec.containers.all(c,
          !has(c.command) && !has(c.workingDir) && !has(c.envFrom) &&
          !has(c.lifecycle) && !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe) &&
          (!has(c.stdin) || !c.stdin) && (!has(c.tty) || !c.tty) &&
          has(c.args) && size(c.args) == 1 &&
          (!has(c.env) || c.env.all(e, !has(e.valueFrom) && e.name in {{ keys .Values.scheduler.taskExtraEnvironment | sortAlpha | toJson }}))) &&
        (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v,
          !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s,
            !has(s.serviceAccountToken) || (has(s.serviceAccountToken.audience) && s.serviceAccountToken.audience != "")))))
      message: >-
        a step's container runs its image's own entrypoint with its action as
        its one argument, no environment but the install's
        (scheduler.taskExtraEnvironment), and no token for the Kubernetes API
      reason: Forbidden
    # A step's Pod, shaped as the executor makes it: its volumes only its
    # request ConfigMap (under its Job's name), scratch space, Secrets
    # (which ones is the identity policy's) and its projected tokens; no
    # pull Secret but the install's (scheduler.taskImagePullSecret); and
    # placed only as the install places steps (scheduler.taskPlacement or a
    # capacityPlacements entry), never on a node named.
    - expression: >-
        request.operation != "CREATE" || request.resource.resource != "jobs" || (
        (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v,
          (has(v.configMap) && v.configMap.name == object.metadata.name) ||
          has(v.emptyDir) || has(v.secret) ||
          (has(v.projected) && (!has(v.projected.sources) || v.projected.sources.all(s, has(s.serviceAccountToken)))))) &&
        {{- if $pullSecret }}
        (!has(object.spec.template.spec.imagePullSecrets) || object.spec.template.spec.imagePullSecrets.all(p,
          has(p.name) && p.name == {{ $pullSecret | quote }})) &&
        {{- else }}
        (!has(object.spec.template.spec.imagePullSecrets) || object.spec.template.spec.imagePullSecrets.size() == 0) &&
        {{- end }}
        (!has(object.spec.template.spec.nodeName) || object.spec.template.spec.nodeName == "") &&
        (has(object.spec.template.spec.nodeSelector) ? object.spec.template.spec.nodeSelector : {}) in {{ $selectors | uniq | toJson }} &&
        (!has(object.spec.template.spec.tolerations) || object.spec.template.spec.tolerations.all(t,
          (has(t.key) ? t.key : "") + "|" + (has(t.operator) ? t.operator : "") + "|" +
          (has(t.value) ? t.value : "") + "|" + (has(t.effect) ? t.effect : "") + "|" +
          (has(t.tolerationSeconds) ? string(t.tolerationSeconds) : "") in {{ $tolerations | uniq | toJson }})) &&
        {{- if not .Values.scheduler.taskPlacement.affinity }}
        !has(object.spec.template.spec.affinity) &&
        {{- end }}
        true)
      message: >-
        a step's Pod mounts only its request, scratch space, Secrets and
        projected tokens, pulls only with the install's pull Secret
        (scheduler.taskImagePullSecret), and runs only where the install
        places steps (scheduler.taskPlacement, capacityPlacements), on no
        node named
      reason: Forbidden
    # A step's Job, hardened as the executor makes it.
    - expression: >-
        request.operation != "CREATE" || request.resource.resource != "jobs" || (
        has(object.spec.template.spec.automountServiceAccountToken) &&
        object.spec.template.spec.automountServiceAccountToken == false &&
        has(object.spec.template.spec.securityContext) &&
        has(object.spec.template.spec.securityContext.runAsNonRoot) &&
        object.spec.template.spec.securityContext.runAsNonRoot == true &&
        (!has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false) &&
        (!has(object.spec.template.spec.hostPID) || object.spec.template.spec.hostPID == false) &&
        (!has(object.spec.template.spec.hostIPC) || object.spec.template.spec.hostIPC == false) &&
        (!has(object.spec.template.spec.volumes) || object.spec.template.spec.volumes.all(v, !has(v.hostPath))) &&
        (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.size() == 0) &&
        object.spec.template.spec.containers.all(c,
          has(c.securityContext) &&
          (!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false &&
          has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true &&
          has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&
          "ALL" in c.securityContext.capabilities.drop &&
          (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0) &&
          (!has(c.securityContext.runAsNonRoot) || c.securityContext.runAsNonRoot == true) &&
          (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser != 0) &&
          (!has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type == "RuntimeDefault") &&
          (!has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))) &&
        has(object.spec.template.spec.securityContext.seccompProfile) &&
        object.spec.template.spec.securityContext.seccompProfile.type == "RuntimeDefault" &&
        (!has(object.spec.template.spec.securityContext.runAsUser) || object.spec.template.spec.securityContext.runAsUser != 0))
      message: >-
        a step's Job must run hardened: no Kubernetes token, non-root
        (each container too), seccomp RuntimeDefault,
        a read-only root filesystem, no capabilities or privilege, nothing of
        the host's
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "execution-kernel.fullname" . }}-dispatch
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  policyName: {{ include "execution-kernel.fullname" . }}-dispatch
  validationActions: [Deny]
{{- end }}

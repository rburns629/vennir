{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabaseUrl) (not .Values.existingSecret) }}
{{- fail "Set postgres.enabled=true, or provide externalDatabaseUrl, or provide existingSecret." }}
{{- end }}
{{- if not .Values.existingSecret }}
{{- /* Once per render: on a fresh install every call is a new random value. */}}
{{- $postgresPassword := include "execution-kernel.postgresPassword" . }}
{{- $ownRole := and .Values.postgres.enabled .Values.postgres.auth.kernelUsername }}
{{- $kernelPassword := include "execution-kernel.kernelPassword" . }}
{{- $policyRole := include "execution-kernel.policyBundledRole" . }}
{{- $policyPassword := ternary (include "execution-kernel.policyPassword" .) "" (ne $policyRole "") }}
{{- /* What the kernel's processes sign in with: their own role's, or the superuser's. */}}
{{- $urlPassword := ternary $kernelPassword $postgresPassword (not (not $ownRole)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "execution-kernel.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
  {{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled .Values.postgres.persistence.keepOnUninstall }}
  annotations:
    # Kept with the volume: the data there only opens with these passwords
    # (Postgres takes POSTGRES_PASSWORD only when it makes a new one), and a
    # reinstall reads them back rather than making new ones.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  database-url: {{ include "execution-kernel.databaseUrl" (dict "root" . "password" $urlPassword) | quote }}
  {{- if $ownRole }}
  kernel-password: {{ $kernelPassword | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  # Sourced by the bundled postgres Deployment's own POSTGRES_PASSWORD env
  # var (via secretKeyRef), so the password exists in exactly one place —
  # not also inline in that Deployment's plain-text spec.
  postgres-password: {{ $postgresPassword | quote }}
  {{- end }}
---
# The same URL for the migration hook, made just before it (an earlier
# hook): a pre-upgrade hook runs before the release's other resources are
# updated, so with the Secret above it would migrate the database the
# release is leaving (switching to a managed one, it sent the new sign-in
# to the old server). Deleted once the hooks succeed: it's the superuser's
# URL, and helm uninstall leaves hook resources behind.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "execution-kernel.fullname" . }}-db-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  database-url: {{ include "execution-kernel.databaseUrl" (dict "root" . "password" $urlPassword) | quote }}
  {{- if $ownRole }}
  # For the migration Job's first step, which makes the role with it.
  kernel-password: {{ $kernelPassword | quote }}
  {{- end }}
  {{- if $policyRole }}
  policy-password: {{ $policyPassword | quote }}
  {{- end }}
{{- if $policyRole }}
---
# kernel policy's own sign-in (catalogPolicy.database): its role holds what
# it uses alone (migrate.GrantPolicy), and its Pod mounts this Secret, never
# the kernel's.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "execution-kernel.fullname" . }}-policy-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
  {{- if and .Values.postgres.persistence.enabled .Values.postgres.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  database-url: "postgresql://{{ $policyRole }}:{{ $policyPassword }}@{{ include "execution-kernel.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}{{ include "execution-kernel.databaseTls" . }}"
  password: {{ $policyPassword | quote }}
{{- end }}
{{- end }}

{{/*
Sleeping when idle (values.yaml's scaleDown, kernel/internal/sleeper). The
sleeper's identity can change only the replica count of the platform's own
Deployments, by name and through the scale subresource, and the one
ConfigMap where it keeps the counts to wake to: nothing that changes what
any Deployment runs. It may also patch two CronJobs (its own, and the wake
one), but only to suspend or resume them and set when they run: the
admission policy below refuses any other change it makes to a CronJob, such
as to the Job it runs. The ConfigMap exists whatever scaleDown says, since
`vertra sleep` uses it too.
*/}}
{{- $fullname := include "execution-kernel.fullname" . }}
{{- $state := printf "%s-sleep" $fullname }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $state }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
{{- if .Values.scaleDown.enabled }}
{{- $s := .Values.scaleDown }}
{{- $console := $s.consoleFullname }}
{{- $deployments := list (printf "%s-api" $fullname) (printf "%s-scheduler" $fullname) (printf "%s-headroom" $fullname) $console (printf "%s-trivy" $console) }}
{{- $databases := list (printf "%s-postgres" $fullname) (printf "%s-postgres" $console) }}
{{- $activity := printf "%s-activity" $console }}
{{- $name := printf "%s-sleeper" $fullname }}
{{- $wake := printf "%s-wake" $fullname }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: {{ concat $deployments $databases | toJson }}
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $state | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $activity | quote }}]
    verbs: ["get"]
  # kernel-api's start time (woken or upgraded counts as activity).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # Its own CronJob, suspended while asleep (no Pod, on EKS Auto Mode no
  # node, every few minutes to find nothing to do); waking resumes it.
  # And the wake CronJob: armed for the console's next schedule when it
  # sleeps, stood down once it's woken (kernel wake).
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [{{ $name | quote }}, {{ $wake | quote }}]
    verbs: ["get", "patch"]
---
# RBAC can name the CronJobs but not the fields; a patch to jobTemplate
# would run anything as any ServiceAccount here (and an owner or finalizer
# would have them deleted, or stop an uninstall).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["cronjobs"]
  matchConditions:
    - name: from-the-sleeper
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace $name | quote }}
  validations:
    - expression: >-
        request.operation == "UPDATE" &&
        object.spec.jobTemplate == oldObject.spec.jobTemplate &&
        has(object.spec.concurrencyPolicy) == has(oldObject.spec.concurrencyPolicy) &&
        (!has(object.spec.concurrencyPolicy) || object.spec.concurrencyPolicy == oldObject.spec.concurrencyPolicy) &&
        has(object.spec.startingDeadlineSeconds) == has(oldObject.spec.startingDeadlineSeconds) &&
        (!has(object.spec.startingDeadlineSeconds) || object.spec.startingDeadlineSeconds == oldObject.spec.startingDeadlineSeconds) &&
        has(object.spec.successfulJobsHistoryLimit) == has(oldObject.spec.successfulJobsHistoryLimit) &&
        (!has(object.spec.successfulJobsHistoryLimit) || object.spec.successfulJobsHistoryLimit == oldObject.spec.successfulJobsHistoryLimit) &&
        has(object.spec.failedJobsHistoryLimit) == has(oldObject.spec.failedJobsHistoryLimit) &&
        (!has(object.spec.failedJobsHistoryLimit) || object.spec.failedJobsHistoryLimit == oldObject.spec.failedJobsHistoryLimit) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)
      message: >-
        The sleeper may only suspend or resume a CronJob and set its schedule
        and time zone.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
  validationActions: [Deny]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $job := list (dict "name" $name "schedule" $s.checkSchedule "command" (list "sleep")) (dict "name" (printf "%s-scheduled" $name) "schedule" $s.schedule "command" (list "sleep" "--now")) (dict "name" $wake "schedule" "0 0 1 1 *" "command" (list "wake") "suspend" true) }}
{{- if $job.schedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $job.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: sleeper
spec:
  schedule: {{ $job.schedule | quote }}
  {{- if $job.suspend }}
  # Waking for a schedule: the sleeper sets its time and un-suspends it as it
  # sleeps, and it stands itself down once it has woken the install.
  suspend: true
  timeZone: Etc/UTC
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ ternary 22500 300 (has "--now" $job.command) }}
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "execution-kernel.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: sleeper
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $name }}
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          {{- if or $.Values.tls.enabled $.Values.database.caSecret }}
          volumes:
            {{- include "execution-kernel.tlsCaVolume" $ | nindent 12 }}
          {{- end }}
          containers:
            - name: sleeper
              image: {{ include "execution-kernel.appImage" $ | quote }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["/usr/local/bin/kernel"{{ range $job.command }}, {{ . | quote }}{{ end }}]
              resources:
                {{- toYaml $s.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              {{- if or $.Values.tls.enabled $.Values.database.caSecret }}
              volumeMounts:
                {{- include "execution-kernel.tlsCaMount" $ | nindent 16 }}
              {{- end }}
              env:
                - name: DATABASE_IAM_AUTH
                  value: {{ $.Values.database.iamAuth | quote }}
                - name: DATABASE_IAM_REGION
                  value: {{ $.Values.database.region | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "execution-kernel.databaseSecretName" $ }}
                      key: {{ include "execution-kernel.databaseSecretKey" $ }}
                - name: SLEEPER_NAMESPACE
                  value: {{ $.Release.Namespace | quote }}
                - name: SLEEPER_IDLE_AFTER_SECONDS
                  value: {{ mul (int $s.idleAfterMinutes) 60 | quote }}
                - name: SLEEPER_DEPLOYMENTS
                  value: {{ $deployments | toJson | quote }}
                - name: SLEEPER_DATABASE_DEPLOYMENTS
                  value: {{ $databases | toJson | quote }}
                - name: SLEEPER_STATE_CONFIGMAP
                  value: {{ $state | quote }}
                - name: SLEEPER_CONSOLE_ACTIVITY_CONFIGMAP
                  value: {{ $activity | quote }}
                - name: SLEEPER_API_POD_SELECTOR
                  value: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s,app.kubernetes.io/component=api" (include "execution-kernel.name" $) $.Release.Name | quote }}
                - name: SLEEPER_CRONJOB
                  value: {{ $name | quote }}
                - name: SLEEPER_WAKE_CRONJOB
                  value: {{ $wake | quote }}
                - name: KUBERNETES_REQUEST_TIMEOUT_SECONDS
                  value: {{ $.Values.scheduler.kubernetesRequestTimeoutSeconds | quote }}
{{- end }}
{{- end }}
{{- end }}

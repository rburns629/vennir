{{/*
Runs `kernel migrate` (kernel/internal/migrate: the SQL files it doesn't
have yet; an install Alembic migrated is taken over) before
kernel-api/kernel-scheduler start serving on a fresh install or upgrade. Kubernetes has no native "wait for
another resource" dependency primitive, so this leans on two things
instead: the Job's own backoffLimit rides out Postgres still starting on a
brand-new install, and Helm itself waits for hook Jobs to reach Complete
before a `pre-upgrade` hook's release is considered finished — the more
important case, since it stops an upgraded kernel-api from ever running
against a stale schema.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "execution-kernel.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "execution-kernel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- if .Values.database.iamAuth }}
      # Signs in to the database as kernel-api does: its ServiceAccount's
      # cloud identity (it exists by then: the hook runs post-install).
      serviceAccountName: {{ include "execution-kernel.apiServiceAccountName" . }}
      {{- end }}
      securityContext:
        {{- include "execution-kernel.podSecurityContext" . | nindent 8 }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- include "execution-kernel.tlsCaVolume" . | nindent 8 }}
      restartPolicy: Never
      {{- if and .Values.postgres.enabled .Values.postgres.auth.kernelUsername (not .Values.existingSecret) }}
      initContainers:
        # As the superuser, the one thing it's used for besides Postgres
        # itself and backups: the kernel's own login role (no superuser, no
        # CREATEDB or CREATEROLE), with this release's password for it, made
        # the owner of the kernel's database and of everything in it, so
        # the migration below and the kernel's processes run as it. An
        # upgrade from the superuser hands over what's already there.
        - name: kernel-role
          image: {{ include "execution-kernel.image" .Values.postgres.image | quote }}
          securityContext:
            {{- include "execution-kernel.containerSecurityContext" . | nindent 12 }}
            runAsUser: 999
            runAsGroup: 999
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "execution-kernel.tlsCaMount" . | nindent 12 }}
          env:
            - {name: HOME, value: /tmp}
            - name: PGHOST
              value: "{{ include "execution-kernel.fullname" . }}-postgres"
            {{- if .Values.tls.enabled }}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/vertra/tls/ca.crt}
            {{- end }}
            - name: PGUSER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-kernel.databaseSecretName" . }}
                  key: postgres-password
            - name: KERNEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "execution-kernel.fullname" . }}-db-migrate
                  key: kernel-password
          command:
            - sh
            - -c
            - |
              set -eu
              # Five minutes at most: a sleeping database fails the Job
              # (its backoffLimit), not the upgrade's whole timeout.
              tries=0
              until pg_isready -q; do
                tries=$((tries + 1)); [ "$tries" -le 150 ] || { echo "Postgres isn't answering"; exit 1; }
                echo "waiting for Postgres"; sleep 2
              done
              psql -v ON_ERROR_STOP=1 -d {{ .Values.postgres.auth.database | quote }} \
                -v role={{ .Values.postgres.auth.kernelUsername | quote }} \
                -v db={{ .Values.postgres.auth.database | quote }} <<'SQL'
              \getenv password KERNEL_PASSWORD
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE', :'role')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L', :'role', :'password') \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'role') \gexec
              SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'role') \gexec
              SELECT format('ALTER SCHEMA public OWNER TO %I', :'role') \gexec
              SELECT format('ALTER %s %I.%I OWNER TO %I',
                  CASE c.relkind WHEN 'S' THEN 'SEQUENCE' WHEN 'v' THEN 'VIEW' WHEN 'm' THEN 'MATERIALIZED VIEW' ELSE 'TABLE' END,
                  n.nspname, c.relname, :'role')
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p', 'v', 'm', 'S')
                  AND pg_get_userbyid(c.relowner) <> :'role'
                  AND NOT (c.relkind = 'S' AND EXISTS (SELECT FROM pg_depend d WHERE d.objid = c.oid AND d.deptype IN ('a', 'i'))) \gexec
              SELECT format('ALTER TYPE %I.%I OWNER TO %I', n.nspname, t.typname, :'role')
                FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
                WHERE n.nspname = 'public' AND t.typtype IN ('e', 'd') AND pg_get_userbyid(t.typowner) <> :'role' \gexec
              SELECT format('ALTER FUNCTION %I.%I(%s) OWNER TO %I', n.nspname, p.proname, pg_get_function_identity_arguments(p.oid), :'role')
                FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND pg_get_userbyid(p.proowner) <> :'role' \gexec
              SQL
              echo "the kernel's database is {{ .Values.postgres.auth.kernelUsername }}'s"
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "execution-kernel.appImage" . | quote }}
          securityContext:
            {{- include "execution-kernel.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "execution-kernel.tlsCaMount" . | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          command: ["/usr/local/bin/kernel", "migrate"]
          env:
            - name: DATABASE_IAM_AUTH
              value: {{ .Values.database.iamAuth | quote }}
            - name: DATABASE_IAM_REGION
              value: {{ .Values.database.region | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # The URL being upgraded to (secret.yaml's hook Secret),
                  # or yours.
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "execution-kernel.fullname" . }}-db-migrate{{ end }}
                  key: {{ include "execution-kernel.databaseSecretKey" . }}

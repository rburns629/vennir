# execution-kernel on GKE `vennir-gke` (release `kernel`, namespace
# vennir-system, the platform's own; never a team's):
#   make gke-deploy VERSION=v<x.y.z>   (the release's signed chart and images)
#   or: helm upgrade --install kernel oci://ghcr.io/rburns629/vennir/charts/execution-kernel --version <x.y.z> -n vennir-system \
#     --reset-values --force-conflicts --kube-context gke_my-gcp-project_us-central1_vennir-gke \
#     -f helm/values/gke/kernel.yaml
# A release's image, signed by its workflow (make gke-deploy VERSION=v...):
# no tag, so the release's chart runs its own (appVersion).
# gke-deploy-kernel-from-source overrides both for a working-copy build.
image:
  repository: ghcr.io/rburns629/vennir/execution-kernel
  pullPolicy: IfNotPresent
backup:
  enabled: false
# Where catalog CI publishes product images. The image policy seeds from
# this on first install; afterwards the Admin page owns the list.
imagePolicy:
  sourceRegistry: us-central1-docker.pkg.dev/my-gcp-project/catalog-products
# Catalog images must carry catalog CI's signature (needs policy-controller,
# helm/values/gke/policy-controller.yaml). The public half of the KMS key
# catalog-signing/catalog-images; list a second key here during a rotation.
imageSignature:
  enabled: true
  publicKeys:
    - |
      -----BEGIN PUBLIC KEY-----
      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEaDo0mkZuGxOGub0gDZwZoWQnqL0t
      WwmAwv/QbAbjM8xn8prY+E+0b9cf4WaxdVdqaqC+G87jHxa4XNvgcCweKg==
      -----END PUBLIC KEY-----
# Nobody but cluster administrators deletes team namespaces: the console
# leaves a purged team's labelled retired (its teamNamespaces.purge is off).
# A purger listed here may delete only retired ones.
purgePolicy:
  purgers: []
# No catalogPolicy (kernel policy verifying the signed catalog release and
# writing which images run as each product, decision 27): off here until
# its ServiceAccount, kernel-execution-kernel-policy, may read the
# catalog's registry and it's proven on this cloud (TODO.md). Meanwhile the
# console writes those policies alone, and its Admin page says so.

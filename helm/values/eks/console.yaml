# execution-console on EKS, as `vennir apply` writes it (see kernel.yaml):
#   helm upgrade --install console oci://ghcr.io/rburns629/vennir/charts/execution-console --version <x.y.z> \
#     -n vennir-system --reset-values --force-conflicts --kube-context <context> -f helm/values/eks/console.yaml
# Its ServiceAccount gets its AWS identity from an EKS Pod Identity
# association (made outside the chart: no annotation), a role that may read
# the products' ECR repositories; see docs/operations.md, Cloud identities.
environmentLabel: eks-prod
# The cloud this install is on: products whose catalog clouds leave it out
# are listed but not checked or run here.
installCloud: aws
bootstrapAdmin:
  email: admin@example.com
kernelApiUrl: https://kernel-execution-kernel-api.vennir-system.svc.cluster.local:8000
# kernel-api's HTTPS, and the kernel's Postgres, are checked against the
# kernel chart's own CA.
tls:
  kernelCaSecret: kernel-execution-kernel-tls-ca
# Both databases on the kernel release's Postgres.
postgres:
  enabled: false
existingSecret: kernel-execution-kernel-console-db
existingSecretKey: database-url
# ECR sign-in from the Pod's own identity (Pod Identity), for pinning and
# checking images; the scanner's Jobs use the same.
registryCheck:
  ecrToken: true
# Steps can't reach the instance metadata server, so not the node's role
# either (a NetworkPolicy in each team namespace).
teamNamespaces:
  blockMetadata: true
# The catalog's release, beside its images, and who may sign it (the same
# signer as the kernel's imageSignature).
catalog:
  release: 123456789012.dkr.ecr.us-east-2.amazonaws.com/vennir-products/catalog-release:latest
  signature:
    publicKeys:
      - |
        -----BEGIN PUBLIC KEY-----
        <the KMS key's public half>
        -----END PUBLIC KEY-----
# The cluster's issuer, which IAM trusts for a team's AWS SecretStore (IRSA;
# register it with `aws iam create-open-id-connect-provider`, once per
# cluster: vennir does for a cluster it makes).
secretSources:
  clusterIssuer: https://oidc.eks.us-east-2.amazonaws.com/id/<id>

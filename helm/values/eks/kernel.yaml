# execution-kernel on EKS (Auto Mode), as `vennir apply` writes it for an
# install of its own (vennir.yaml target: aws): an example to start from
# when installing with Helm by hand. Account 123456789012, us-east-2,
# install `vennir`, platform namespace vennir-system:
#   helm upgrade --install kernel oci://ghcr.io/rburns629/vennir/charts/execution-kernel --version <x.y.z> \
#     -n vennir-system --create-namespace --reset-values --force-conflicts \
#     --kube-context <context> -f helm/values/eks/kernel.yaml
# The release's own image (appVersion): no image block.
backup:
  enabled: false
# One Postgres (in a Pod, on an EBS volume) for both databases, each with its
# own role: the console's console.yaml reads kernel-execution-kernel-console-db,
# and its gateway kernel-execution-kernel-gateway-db, both made here.
postgres:
  consoleDatabase:
    enabled: true
# Where catalog CI publishes product images (ECR, under one prefix). The
# image policy seeds from this on first install; afterwards the Admin page
# owns the list.
imagePolicy:
  sourceRegistry: 123456789012.dkr.ecr.us-east-2.amazonaws.com/vennir-products
# Catalog images must carry catalog CI's signature (needs policy-controller,
# policy-controller.yaml): the public half of the AWS KMS key only the
# catalog's CI may sign with (`aws kms get-public-key`, as PEM), and/or its
# keyless identity.
imageSignature:
  enabled: true
  publicKeys:
    - |
      -----BEGIN PUBLIC KEY-----
      <the KMS key's public half>
      -----END PUBLIC KEY-----
  keyless:
    issuer: ""
    subjectRegExp: ""
scaleDown:
  enabled: true
  idleAfterMinutes: 120
scheduler:
  # Steps run on their own node pool (a Karpenter NodePool, vennir-steps:
  # label vennir.dev/pool=steps, taint vennir.dev/steps=true:NoSchedule),
  # which scales from zero and takes Spot and on-demand nodes.
  taskPlacement:
    nodeSelector:
      vennir.dev/pool: steps
    tolerations:
      - {key: vennir.dev/steps, operator: Equal, value: "true", effect: NoSchedule}
  # Where a product asking for a kind of capacity (product.yaml's capacity)
  # runs instead: Karpenter's label picks one on the same pool.
  capacityPlacements:
    spot:
      nodeSelector: {vennir.dev/pool: steps, karpenter.sh/capacity-type: spot}
      tolerations:
        - {key: vennir.dev/steps, operator: Equal, value: "true", effect: NoSchedule}
    onDemand:
      nodeSelector: {vennir.dev/pool: steps, karpenter.sh/capacity-type: on-demand}
      tolerations:
        - {key: vennir.dev/steps, operator: Equal, value: "true", effect: NoSchedule}
# No catalogPolicy here (kernel policy verifying the signed catalog release
# and writing which images run as each product, decision 27): vennir turns
# it on for an EKS install whose catalog is signed, with the role the aws
# module makes for it (cli/internal/install's catalogPolicyValues). An
# install from these values gives kernel-execution-kernel-policy a role
# that reads the catalog's registry first (Pod Identity), then sets
# catalogPolicy as vennir does. Meanwhile the console writes those
# policies alone, and its Admin page says so.

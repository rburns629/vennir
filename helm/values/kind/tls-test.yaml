# Applied by make kind-tls (after cert-manager and Traefik): a private CA for
# kind, which no browser trusts (Let's Encrypt can't reach a laptop), and a
# Gateway for trying the console's gatewayApi. Never for a real cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vennir-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vennir-test-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Vennir kind test CA
  secretName: vennir-test-ca
  duration: 8760h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: vennir-selfsigned, kind: ClusterIssuer}
---
# Issues the console's certificate: ingress.certManager.issuer: vennir-test-ca.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vennir-test-ca
spec:
  ca:
    secretName: vennir-test-ca
---
# For gatewayApi.parentRefs (sectionName https) and redirectParentRefs
# (sectionName http). cert-manager issues its certificate from the annotation.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vennir-test
  namespace: vennir-system
  annotations:
    cert-manager.io/cluster-issuer: vennir-test-ca
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes: {namespaces: {from: Same}}
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: console-gw.vennir.test
      tls:
        mode: Terminate
        certificateRefs: [{name: vennir-test-gateway-tls}]
      allowedRoutes: {namespaces: {from: Same}}

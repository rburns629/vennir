name: cla

# The Contributor License Agreement (CLA.md), through CLA Assistant Lite: on
# a pull request, every author who hasn't accepted it is asked to, by
# commenting the sentence below; the check passes once all have. Signatures
# are kept in signatures/cla.json on the cla-signatures branch, not main, so
# main can be protected. pull_request_target runs this file as it is on main
# with a write token, so it must never check out or run the pull request's
# code; the action reads only its comments and authors.
#
# Not on a pull request closing (the action would only lock it, and each
# trigger is a run in the Actions list). Every comment still starts a run,
# skipped unless it's the sentence below or "recheck": GitHub can't filter
# comments before a run starts.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA and I accept it'))
    runs-on: ubuntu-latest
    permissions:
      actions: write        # reruns the check after a signing comment
      contents: write       # commits signatures to cla-signatures
      pull-requests: write  # comments
      statuses: write       # the check's status
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # Exact names only: the action's wildcards aren't anchored, so
          # "bot*" would exempt anyone whose name merely contains "bot".
          allowlist: roburns,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA and I accept it
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be merged, each of its
            authors needs to accept Vennir's
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md),
            once, by commenting the sentence below. You keep the copyright in
            your work.
          custom-allsigned-prcomment: Every author of this pull request has accepted the CLA.
          signed-commit-message: "cla: $contributorName accepted it"  # the action fills in only $contributorName, $owner and $repo
          create-file-commit-message: "cla: the file of who accepted the CLA"
          lock-pullrequest-aftermerge: false

name: release

# On a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release):
#
#   preflight  refuses a tag whose commit isn't on main, a tag whose vertra
#              code reaches a known vulnerability (govulncheck, as CI), and
#              a version that's already published, even in part. A tag push
#              runs the tagged commit's own copy of this file, so the main
#              check stops mistakes. That only reviewed code is released (and
#              signed with the release's identity) rests on the repository's
#              `release tags` ruleset: only admins create, move or delete v*
#              tags (docs/security-model.md).
#   images     builds the kernel, console and gateway images for
#              linux/amd64 and linux/arm64 and pushes them, by digest only,
#              to ghcr.io/<owner>/<repo>/execution-{kernel,console,gateway},
#              then scans each platform's image, as pushed, with the same
#              gate CI uses (.github/scripts/scan-image.sh).
#   publish    once all three have passed, signs each by digest, keyless,
#              with this workflow's own identity, then tags each as the
#              version, then as latest (only for the highest version
#              released: not a pre-release, nor a backport like v0.7.1 after
#              v0.8.0).
#   charts     packages both Helm charts at that version (their appVersion
#              too, so they run the images just published), pushes them to
#              oci://ghcr.io/<owner>/<repo>/charts, signs them, and creates
#              the GitHub release with the packaged charts attached.
#   cli        builds vertra for linux and darwin, amd64 and arm64, from this
#              tag (with its catalog template inside, for `catalog create`,
#              and the charts' SHA-256s, which it checks them against),
#              pushes each binary to ghcr.io/<owner>/<repo>/cli as one blob
#              (tag <version>-<os>-<arch>; its digest is the binary's
#              SHA-256), signs each, and attaches the binaries and
#              vertra-checksums.txt and the manual pages (vertra-man.tar.gz)
#              to the release. A catalog's ./vertra downloads its platform's
#              blob anonymously by that SHA-256: pin a release with
#              .github/scripts/pin-vertra.sh <version>.
#   pin        for the highest version released, opens the pull request
#              that pins it in the catalog template.
#
# A version's tags are written once (.github/scripts/published.sh checks).
# If a run fails part-way, finish it with "Re-run failed jobs": each job
# keeps what an earlier attempt published, and refuses a tag that names
# anything else. "Re-run all jobs", or the tag pushed again, stops at
# preflight; to release again, tag a new version.
#
# Verify an image: cosign verify ghcr.io/<owner>/<repo>/execution-kernel:<v> \
#   --certificate-identity-regexp '^https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v.*' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# The packages are private on first push: make them public on GitHub (the
# package's settings) once, so `helm install`, image pulls and a catalog's
# ./vertra need no login.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # whether the version is in the registry already
    outputs:
      # Whether this is the highest version released (pre-releases aside):
      # only then does it become latest and get pinned.
      latest: ${{ steps.latest.outputs.latest }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # main's history, to find the tag's commit in it
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main: only a commit on main is released."
            exit 1
          fi
      - name: Whether it's the highest version
        # A backport (v0.7.1 after v0.8.0) is released, but doesn't move
        # latest back or pin the template to an older vertra.
        id: latest
        run: |
          latest=false
          case "$TAG" in
            *-*) ;;
            *) highest=$(git tag --list 'v[0-9]*' | grep -v -e - | sort -V | tail -n 1)
               if [ "$highest" = "$TAG" ]; then latest=true; fi
               echo "The highest version tagged is $highest" ;;
          esac
          echo "latest=$latest" | tee -a "$GITHUB_OUTPUT"
      - name: vertra's code reaches no known vulnerability
        # As CI's govulncheck job, in the Go image vertra is built with. The
        # version is pinned in both (here and ci.yml): bump them together.
        run: |
          image=$(sed -n 's/^GO_IMAGE ?= *//p' Makefile)
          docker run --rm -v "$PWD":/repo -w /repo/cli -e CGO_ENABLED=0 "$image" \
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: bash .github/scripts/install-scanners.sh oras
      - name: The version isn't published yet
        # A re-run of every job would build new bytes under a version that
        # may already have been verified; re-running the failed jobs only
        # doesn't run this one again.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          found=()
          for ref in execution-kernel:$version execution-console:$version execution-gateway:$version \
              charts/execution-kernel:$version charts/execution-console:$version \
              cli:$version-linux-amd64 cli:$version-linux-arm64 cli:$version-darwin-amd64 cli:$version-darwin-arm64; do
            status=0
            bash .github/scripts/published.sh "$registry/$ref" > /dev/null || status=$?
            case "$status" in 0) found+=("$registry/$ref") ;; 1) ;; *) exit 1 ;; esac
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            found+=("the GitHub release $TAG")
          fi
          if [ "${#found[@]}" -gt 0 ]; then
            echo "::error::$version is already published: ${found[*]}"
            echo "To finish a run that failed part-way, re-run its failed jobs only. To release again, tag a new version."
            exit 1
          fi

  images:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [kernel, console, gateway]
    # Each leg sets its own: the image it pushed and scanned, by digest.
    outputs:
      kernel: ${{ steps.scan.outputs.kernel }}
      console: ${{ steps.scan.outputs.console }}
      gateway: ${{ steps.scan.outputs.gateway }}
    env:
      COMPONENT: ${{ matrix.component }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/install-scanners.sh trivy osv-scanner
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push by digest (amd64, arm64)
        # No tag: nothing names it until every image has passed its scan.
        id: push
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/execution-$COMPONENT"
          docker buildx build --platform linux/amd64,linux/arm64 --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=MIT" \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" "$COMPONENT/"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
      - name: Scan what was pushed, each platform
        # The very bytes pushed, pulled back by each platform's own digest
        # (not the index's, which a daemon resolves to its own platform),
        # with the gate CI uses.
        id: scan
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          image="${REF%@*}"
          docker buildx imagetools inspect --raw "$REF" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)-\(.platform.architecture) \(.digest)"' \
            > "$RUNNER_TEMP/platforms"
          cat "$RUNNER_TEMP/platforms"
          [ "$(cut -d' ' -f1 "$RUNNER_TEMP/platforms" | sort | tr '\n' ' ')" = "linux-amd64 linux-arm64 " ] \
            || { echo "::error::$REF doesn't hold exactly linux/amd64 and linux/arm64."; exit 1; }
          failed=0
          mapfile -t platforms < "$RUNNER_TEMP/platforms"
          for line in "${platforms[@]}"; do
            platform="${line% *}" digest="${line#* }"
            docker pull -q --platform "${platform/-//}" "$image@$digest"
            docker tag "$image@$digest" "vertra-release/$COMPONENT:$platform"
            bash .github/scripts/scan-image.sh "vertra-release/$COMPONENT:$platform" "$COMPONENT" || failed=1
          done
          if [ "$failed" != 0 ]; then exit 1; fi
          echo "$COMPONENT=$REF" >> "$GITHUB_OUTPUT"

  publish:
    needs: [preflight, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing
    env:
      TAG: ${{ github.ref_name }}
      LATEST: ${{ needs.preflight.outputs.latest }}
      KERNEL: ${{ needs.images.outputs.kernel }}
      CONSOLE: ${{ needs.images.outputs.console }}
      GATEWAY: ${{ needs.images.outputs.gateway }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/install-scanners.sh cosign oras
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # cosign reads Docker's credentials.
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Sign and tag the images
        # Every check first, then every signature, then the version tags,
        # then latest: a failure part-way leaves no version tag on an image
        # that isn't signed. One an earlier attempt already tagged with this
        # run's image is kept (and was signed before it was tagged).
        run: |
          version="${TAG#v}"
          refs=("$KERNEL" "$CONSOLE" "$GATEWAY")
          todo=()
          for ref in "${refs[@]}"; do
            [[ "$ref" =~ ^ghcr\.io/[^@]+@sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::An image's digest is missing ('$ref'): re-run the failed jobs."; exit 1; }
            status=0
            tagged=$(bash .github/scripts/published.sh "${ref%@*}:$version") || status=$?
            case "$status" in
              0) [ "$tagged" = "${ref#*@}" ] \
                   || { echo "::error::${ref%@*}:$version is already $tagged, not this run's ${ref#*@}."; exit 1; }
                 echo "${ref%@*}:$version is already this run's image" ;;
              1) todo+=("$ref") ;;
              *) exit 1 ;;
            esac
          done
          for ref in "${todo[@]}"; do cosign sign --yes "$ref"; done
          for ref in "${todo[@]}"; do oras tag "$ref" "$version"; done
          if [ "$LATEST" = true ]; then
            for ref in "${refs[@]}"; do oras tag "$ref" latest; done
          else
            echo "$version isn't the highest version released: latest stays where it is"
          fi

  charts:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    outputs:
      # Each package's SHA-256, sha256sum's lines: what vertra checks a
      # pulled chart against (cli/internal/install/release-charts.sha256).
      sums: ${{ steps.package.outputs.sums }}
    permissions:
      contents: write   # the GitHub release
      packages: write
      id-token: write   # keyless signing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: bash .github/scripts/install-scanners.sh cosign oras
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Helm keeps its own credentials; cosign reads Docker's.
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Package, push and sign the charts
        id: package
        # A chart an earlier attempt pushed is kept, and pulled for the
        # GitHub release, not packaged again (a new package is new bytes);
        # signing it again only adds a signature.
        run: |
          version="${TAG#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY,,}/charts"
          mkdir -p dist
          for chart in execution-kernel execution-console; do
            status=0
            digest=$(bash .github/scripts/published.sh "$registry/$chart:$version") || status=$?
            case "$status" in
              0) echo "$chart $version is already published: keeping it"
                 helm pull "oci://$registry/$chart" --version "$version" -d dist ;;
              1) helm package "helm/charts/$chart" --version "$version" --app-version "$version" -d dist
                 helm push "dist/$chart-$version.tgz" "oci://$registry"
                 digest=$(bash .github/scripts/published.sh "$registry/$chart:$version") ;;
              *) exit 1 ;;
            esac
            cosign sign --yes "$registry/$chart@$digest"
          done
          { echo "sums<<EOF"; (cd dist && sha256sum execution-*.tgz); echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.preflight.outputs.latest }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber
            exit 0
          fi
          flags=(--latest="$LATEST")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/*.tgz --verify-tag --generate-notes "${flags[@]}"

  cli:
    needs: charts   # the GitHub release it attaches to, and its charts' sums
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach to the GitHub release
      packages: write
      id-token: write   # keyless signing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/install-scanners.sh oras cosign
      - name: Build vertra for each platform
        # In the Go image CI uses, pinned by digest (the Makefile's GO_IMAGE).
        env:
          CHART_SUMS: ${{ needs.charts.outputs.sums }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=$(sed -n 's/^GO_IMAGE ?= *//p' Makefile)
          mkdir -p dist
          # The charts' sums this vertra checks them against: this release's,
          # and any earlier release's whose pin pull request hasn't merged
          # (from its attached packages' digests).
          sums=cli/internal/install/release-charts.sha256
          {
            printf '%s\n' "$CHART_SUMS"
            for tag in $(gh release list --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName'); do
              gh release view "$tag" --json assets \
                --jq '.assets[] | select(.digest != null and (.name | test("^execution-(kernel|console)-.*\\.tgz$"))) | "\(.digest | ltrimstr("sha256:"))  \(.name)"'
            done
          } | while IFS= read -r line; do
            [ -z "$line" ] || grep -qxF "$line" "$sums" || printf '%s\n' "$line" >> "$sums"
          done
          # The catalog template it makes catalogs from (`catalog create`),
          # this tag's tracked files with their modes.
          git archive --format=tar.gz HEAD catalog-template -o cli/internal/catalogtemplate/template.tgz
          test -s cli/internal/catalogtemplate/template.tgz
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            docker run --rm -v "$PWD":/repo -w /repo/cli -e CGO_ENABLED=0 \
              -e GOOS="${platform%-*}" -e GOARCH="${platform#*-}" "$image" \
              go build -trimpath -ldflags "-s -w -X main.Version=$TAG" -o "/repo/dist/vertra-$platform" ./cmd/vertra
          done
          # The manual pages, the same for every platform: man1/*.1.
          dist/vertra-linux-amd64 man dist/man
          tar -C dist/man -czf dist/vertra-man.tar.gz man1
          (cd dist && sha256sum vertra-* > vertra-checksums.txt && cat vertra-checksums.txt)
      - name: Sign in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push and sign each binary
        # A binary an earlier attempt pushed is kept if it's these bytes (the
        # build is reproducible), and refused if it isn't.
        run: |
          version="${TAG#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY,,}/cli"
          published="$PWD/.github/scripts/published.sh"
          cd dist
          {
            echo "### vertra $TAG"
            echo
            echo "Pin it in a catalog's ./vertra: \`.github/scripts/pin-vertra.sh $version\`"
            echo
            echo '| Platform | SHA-256 (the blob a catalog downloads) |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            ref="$registry:$version-$platform"
            sum=$(sha256sum "vertra-$platform" | cut -d' ' -f1)
            status=0
            bash "$published" "$ref" > /dev/null || status=$?
            case "$status" in
              0) blob=$(oras manifest fetch "$ref" | jq -r '.layers[0].digest')
                 [ "$blob" = "sha256:$sum" ] \
                   || { echo "::error::$ref is already published as $blob, not this build's sha256:$sum."; exit 1; }
                 echo "$ref is already this build's binary" ;;
              1) oras push "$ref" \
                   --artifact-type application/vnd.vertra.cli.v1 \
                   "vertra-$platform:application/vnd.vertra.cli.binary.v1" ;;
              *) exit 1 ;;
            esac
            digest=$(oras resolve "$ref")
            cosign sign --yes "$registry@$digest"
            echo "| $platform | \`$sum\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/vertra-* --clobber

  # The catalog template's ./vertra pinned to this release, as a pull
  # request against main (which is protected), for the highest version
  # released (not a pre-release, nor a backport): until it merges, a catalog
  # made from the template by hand pins the previous release (`vertra
  # catalog create` pins its own). A backport's charts' sums still reach
  # every later vertra: the cli job collects every release's.
  # Needs "Allow GitHub Actions to create and approve pull requests" on,
  # and the cli package public (pin-vertra.sh downloads as a catalog does):
  # on a first release, make it public, then re-run this job. A pull
  # request this token opens doesn't start CI: close and reopen it.
  pin:
    needs: [preflight, charts, cli]   # the checksums it pins and the charts' sums it records, and the public blobs it checks
    if: ${{ needs.preflight.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # its branch
      pull-requests: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Open the pin's pull request
        env:
          CHART_SUMS: ${{ needs.charts.outputs.sums }}
        run: |
          version="${TAG#v}"
          branch="pin-vertra-$version"
          bash .github/scripts/pin-vertra.sh "$version"
          # And its charts' sums, for every vertra built after it.
          sums=cli/internal/install/release-charts.sha256
          while IFS= read -r line; do
            [ -z "$line" ] || grep -qxF "$line" "$sums" || printf '%s\n' "$line" >> "$sums"
          done <<< "$CHART_SUMS"
          if git diff --quiet; then
            echo "catalog-template/vertra already pins $version, and its charts' sums are recorded"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: pin vertra $version in the catalog template, and record its charts' sums"
          # A re-run (the setting was off, say) replaces its own branch.
          git push --force origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "Its pull request is already open"
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "chore: pin vertra $version in the catalog template" \
            --body "The catalog template's \`./vertra\` pinned to the release just made, by \`.github/scripts/pin-vertra.sh $version\` (each platform's binary checked to download anonymously and match \`vertra-checksums.txt\`), and its charts' SHA-256s added to \`cli/internal/install/release-charts.sha256\`, which vertra checks a pulled chart against. Opened by the release workflow: close and reopen it to run CI."

# Monthly update pull requests for everything this repository ships: the
# platform's own dependencies and images, its workflows, and the catalog
# template's starters (what new catalogs copy). One entry per ecosystem, each
# grouped into one pull request (npm's majors apart), because each pull
# request runs every check: monthly and grouped keeps the Actions list short.
# A release must be a week old before it's proposed, so a hijacked release
# has time to be caught. Security updates (Dependabot alerts) aren't these:
# they come as soon as an advisory does, if enabled in the repository's
# settings. CI checks every one of them like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /console
      - /console/frontend
      - /site/docs-build
      - /catalog-template/samples/local/products/reverse
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    # Minor and patch updates together; each major in a pull request of its
    # own, since one breaking change would otherwise hold back the rest.
    groups:
      npm: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      # typescript-eslint's peer range stops below TypeScript 7, so npm ci
      # refuses the pair; lift this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directories:
      - /cli
      - /kernel
      - /gateway
      - /catalog-template/samples/local/products/slug
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      go: {patterns: ["*"]}

  - package-ecosystem: docker
    directories:
      - /kernel
      - /console
      - /gateway
      - /examples/*
      - /catalog-template/templates/*
      - /catalog-template/samples/*/products/*
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      base-images: {patterns: ["*"]}

  - package-ecosystem: github-actions
    directories: [/, /catalog-template]
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}

  # The catalog template's Rust sample.
  - package-ecosystem: cargo
    directory: /catalog-template/samples/local/products/rot13
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      sample-cargo: {patterns: ["*"]}

  # The cloud samples' requirements.txt, pinned by hash.
  - package-ecosystem: pip
    directories:
      - /catalog-template/samples/gcp/products/*
      - /catalog-template/samples/aws/products/*
      - /catalog-template/samples/azure/products/*
    schedule: {interval: monthly}
    cooldown: {default-days: 7}
    groups:
      sample-pip: {patterns: ["*"]}

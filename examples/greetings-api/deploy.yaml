# The greetings backend in the local team's namespace, as the team itself
# would run it (kubectl, or its own CD): `make kind-sample-api` builds it and
# applies this. vennir/api-backend: "true" is what lets the gateway reach it
# (the console's vennir-gateway-ingress NetworkPolicy); every other Pod in
# the namespace stays closed to it. vennir/api names the API product it
# serves, so Observe can search its lines by API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greetings
  namespace: local
spec:
  replicas: 1
  selector:
    matchLabels: {app: greetings}
  template:
    metadata:
      labels:
        app: greetings
        vennir/api-backend: "true"
        vennir/api: greetings
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: greetings
          image: localhost:5001/local/greetings-api:demo
          # A reused tag: pulled again on every rollout.
          imagePullPolicy: Always
          env:
            - name: GATEWAY_JWKS_URL
              value: http://console-execution-console-gateway.vennir-system.svc.cluster.local:8080/.vennir/jwks.json
            # This backend's origin, as the API's backend.url names it: the
            # Vennir-Caller token's audience.
            - name: AUDIENCE
              value: http://greetings.local.svc.cluster.local:8080
            # The API it serves, <team>/<name>: a token for another API, even
            # one at this origin, is refused.
            - name: API
              value: local/greetings
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: greetings
  namespace: local
spec:
  selector: {app: greetings}
  ports: [{port: 8080, targetPort: 8080}]

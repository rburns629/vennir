# A product shaped like real work: it calls an API, can authenticate with a
# secret, and tells the platform which failures are worth retrying.
# Copy to teams/<your-team>/products/http-check/.
#
# Never share check (no shareWith) while it can send the token: a shared
# action runs with your team's secrets whoever calls it, and the caller
# picks the URL, so they'd choose where your token goes. To share it, drop
# useToken and the secretRefs, or fix the host in the code.
apiVersion: vertra.dev/v2
kind: Product
name: http-check
team: try-anna             # CHANGE: your team
displayName: HTTP check
description: >-
  Calls an HTTPS URL and reports its status code. Optionally sends a bearer
  token from the http-check-token secret. Reads only; changes nothing.
owner: anna                    # CHANGE: your team
runtime: python3.12
actions:
  - name: check
    script: actions/check.py
    input:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          pattern: "^https://"
          description: The URL to call. HTTPS only.
        expectStatus:
          type: integer
          description: The status code that counts as healthy. Default 200.
        useToken:
          type: boolean
          description: >-
            Send the http-check-token secret as a bearer token. Redirects
            then aren't followed, so the token goes only to this URL.
    output:
      type: object
      required: [status, healthy]
      properties:
        status: {type: integer}
        healthy: {type: boolean}
    secretRefs:
      - name: http-check-token
        keys: [value]
        description: >-
          Only with useToken: the bearer token for the URL. Never logged
          or returned.

name: catalog-ci

# A thin wrapper: everything it does is ./vertra catalog (the pinned vertra), the
# same command a laptop runs in local mode. On main it publishes the changed
# products, then the catalog's release (<registry>/catalog-release): every
# team, product and SecretStore as of this commit, which each install's
# console reads, verifies and applies by itself. So this holds no console or
# cluster credential, and one catalog serves any number of installs. Where to
# publish is vertra.yaml, overridden here by this repository's variables and
# secrets:
#
#   vars.VERTRA_REGISTRY       where images and releases go: <registry>/<team>/<product>
#   vars.VERTRA_SIGNING_MODE   none | key | keyless
#   vars.VERTRA_SIGNING_KEY    for key: env://COSIGN_PRIVATE_KEY, gcpkms://..., awskms://...
#   secrets.COSIGN_PRIVATE_KEY, secrets.COSIGN_PASSWORD   for a generated key
#
# Registry sign-in, by whichever of these is set:
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER + vars.PUBLISH_GCP_SERVICE_ACCOUNT
#   vars.AWS_ROLE_ARN + vars.AWS_REGION     (ECR, through GitHub's OIDC token)
#   vars.REGISTRY_USERNAME + secrets.REGISTRY_PASSWORD
#
# A secret goes in the catalog-publish Environment, never at repository
# level: every pull request's workflows get repository secrets, and one that
# edits a workflow can print them. Without Environments (a private repository
# on GitHub Free), use only what needs no secret: OIDC to the registry, and
# keyless or KMS signing. `vertra catalog create` warns about any it finds.
#
# A team whose builds need values of their own (a private package registry's
# token) is listed in vertra.yaml's buildEnvironments, and its secrets go in
# its own Environment, team-<name>, which `./vertra catalog environments`
# makes and limits to main. On main its products are built there (the build
# job), each secret offered to docker build by name, and publish loads the
# images; a pull request only validates them. Values a step uses when it
# runs are the console's team secrets (secretRefs), never these.

on:
  # No paths filter: `check` is a required status check on main (README,
  # "Protecting main"), and a required check that never starts blocks the
  # pull request. --changed already checks only the products it changes.
  pull_request:
  push:
    branches: [main]
    paths: ["teams/**", "tools/**", "vertra.yaml", "vertra"]
  # Checks every product again: base images get new fixes, and the
  # vulnerability database new findings, without anything here changing.
  # And copies the approved base images (bases.yaml) into the registry again.
  schedule:
    - cron: "17 5 * * 1"
  # Rebuilds (and on main republishes) every product; with a version,
  # makes that version instead (version.yml asks for it when a vX.Y.Z tag
  # is pushed).
  workflow_dispatch:
    inputs:
      version:
        description: "Make this version (vX.Y.Z) of a commit's release, instead of publishing"
        required: false
        default: ""
      commit:
        description: "With a version: the commit whose release it is (default: main's)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Pull requests and the weekly run: validate, build, test and scan. Never
  # pushes anything, so it needs no credentials. A team that builds in its
  # own Environment has its products only validated on a pull request,
  # which can't have that Environment's secrets; weekly, the build job
  # builds them there and this loads them.
  check:
    needs: build
    if: >-
      !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # to diff against the pull request's base
      - name: Install scanners
        run: bash .github/scripts/install-scanners.sh trivy osv-scanner actionlint
      - name: Lint the workflows
        if: github.event_name == 'pull_request'
        run: actionlint
      - name: Download the images teams' Environments built
        if: github.event_name == 'schedule' && needs.build.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          merge-multiple: true
          path: images
      - name: Check the changed products
        env:
          # Empty (the weekly run) checks everything.
          BASE: ${{ github.event.pull_request.base.sha }}
          IMAGES: ${{ github.event_name == 'schedule' && 'images' || '' }}
        run: ./vertra catalog check --changed "$BASE" --images "$IMAGES"

  # main, before publishing: gitleaks and Semgrep (security.yml), so a
  # finding stops the publish even if it was merged.
  security:
    if: github.ref == 'refs/heads/main' && inputs.version == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # main: which of the products publish will choose are built in their
  # team's own Environment (./vertra catalog plan), once it has checked each
  # such Environment can be used from main only. It signs in to the
  # registry only to see what isn't published yet, as publish does.
  plan:
    if: >-
      github.ref == 'refs/heads/main' && inputs.version == '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: catalog-publish
    permissions:
      contents: read
      actions: read     # teams' Environments' branch rules
      id-token: write   # registry sign-in through OIDC
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    env:
      VERTRA_REGISTRY: ${{ vars.VERTRA_REGISTRY }}
      VERTRA_SIGNING_MODE: ${{ vars.VERTRA_SIGNING_MODE }}
      VERTRA_SIGNING_KEY: ${{ vars.VERTRA_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # to diff against the push's previous commit
      - uses: ./.github/actions/registry-sign-in
        with:
          registry: ${{ vars.VERTRA_REGISTRY }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.PUBLISH_GCP_SERVICE_ACCOUNT }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Plan the teams' builds
        id: plan
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./vertra catalog plan --changed "$BASE" --out plan.json
          echo "builds=$(cat plan.json)" >> "$GITHUB_OUTPUT"

  # main: each team that builds in its own Environment, in it (team-<name>,
  # main only): its secrets are offered to docker build by name (a
  # Dockerfile reads one with RUN --mount=type=secret,id=NAME, so it's never
  # in a layer), and the images are saved for publish, or the weekly check,
  # to load, test, scan, push and sign. It holds no registry credential and
  # can't sign in to a cloud, pushes nothing, and no other team's job sees
  # its secrets.
  build:
    needs: plan
    if: needs.plan.outputs.builds != '' && needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one team's failure never stops another's build
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    environment: team-${{ matrix.team }}
    permissions:
      contents: read
    env:
      # Not a credential: what the images are built for follows from it.
      VERTRA_REGISTRY: ${{ vars.VERTRA_REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build team ${{ matrix.team }}'s products
        env:
          # The plan's product folders (lowercase names, so splitting is safe).
          PRODUCTS: ${{ join(matrix.products, ' ') }}
          VERTRA_BUILD_SECRETS: ${{ toJSON(secrets) }}
        run: |
          read -ra products <<< "$PRODUCTS"
          ./vertra catalog build --out images "${products[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-${{ matrix.team }}
          path: images
          retention-days: 1
          if-no-files-found: error

  # main: the same checks, then push and sign each product that passed, then
  # the release. Runs in the catalog-publish Environment, which only main may
  # use, so a workflow edited in a pull request never gets its credentials.
  # A team's products built in its own Environment are loaded from that
  # build (--images), never built here.
  # One run at a time, in order: a release names the images as of its commit.
  # With a version it only tags a release main already published and signed
  # (`vertra catalog promote`), so it signs nothing; it queues apart, so a
  # later push can't cancel it while it waits.
  # Weekly (the schedule), it mirrors the approved bases instead: the same
  # sign-in, no products published.
  publish:
    needs: [security, plan, build]
    # Products only once security passed and the plan was made; a version
    # and the weekly bases mirror publish no product, so they don't wait for
    # either. A team's failed build fails its own products here, as a failed
    # check does.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (needs.security.result == 'success' || (needs.security.result == 'skipped' && (inputs.version != '' || github.event_name == 'schedule'))) &&
      (needs.plan.result == 'success' || inputs.version != '' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: catalog-publish
    concurrency:
      group: ${{ inputs.version != '' && 'catalog-version' || github.event_name == 'schedule' && 'catalog-bases' || 'catalog-publish' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # cloud sign-in through OIDC, and keyless signing
    env:
      VERTRA_REGISTRY: ${{ vars.VERTRA_REGISTRY }}
      VERTRA_SIGNING_MODE: ${{ vars.VERTRA_SIGNING_MODE }}
      VERTRA_SIGNING_KEY: ${{ vars.VERTRA_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # to diff against the push's previous commit
      - name: Install scanners and cosign
        if: inputs.version == ''
        run: bash .github/scripts/install-scanners.sh trivy osv-scanner cosign
      - uses: ./.github/actions/registry-sign-in
        with:
          registry: ${{ vars.VERTRA_REGISTRY }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.PUBLISH_GCP_SERVICE_ACCOUNT }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Copy the approved base images into the registry
        if: github.event_name == 'schedule' && hashFiles('bases.yaml') != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: ./vertra catalog bases mirror

      - name: Download the images teams' Environments built
        if: inputs.version == '' && github.event_name != 'schedule' && needs.build.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-*
          merge-multiple: true
          path: images
      - name: Check, push and sign the changed products, then release the catalog
        if: inputs.version == '' && github.event_name != 'schedule'
        env:
          # Empty (a manual run) publishes everything.
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          ./vertra catalog publish --changed "$BASE" --images images
          ./vertra catalog release

      - name: Make the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: ./vertra catalog promote "$VERSION" --from "${COMMIT:-HEAD}" --wait 30m

name: security

# Code and secret scanning for everything in this repo. (Each product IMAGE
# is scanned by ./vertra in ci.yml, between its tests and its push, so a
# failing image is never published, and again by its weekly run.)
#
#   secrets          gitleaks over the commits a PR or push adds, and over
#                    the whole history on the weekly run.
#   code             Semgrep: Python, TypeScript, JavaScript, Go, Rust,
#                    Dockerfile, GitHub Actions and secret rules from the
#                    Semgrep registry, plus this repo's own
#                    .semgrep/malicious.yml (reverse shells, piping downloads to a shell,
#                    hidden payloads, mining, calls to bare IPs), which also
#                    covers PowerShell (Semgrep has no PowerShell rules).
#
# GitHub Advanced Security isn't enabled on this repo, so results go to each
# run's summary and annotations rather than the Security tab. Any finding
# fails the run.
#
# A pull request's run is what main's ruleset requires (`secrets` and
# `code`; README, "Protecting main"). ci.yml also calls it before
# publishing (workflow_call), so nothing is published past a finding even
# where no ruleset requires it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/install-scanners.sh gitleaks
      - name: Scan for committed secrets
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        # Only the commits this event adds; the whole history on the weekly
        # or manual run, or when a push has no usable "before".
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)         range="$PUSH_BEFORE..$GITHUB_SHA" ;;
            *)            range="" ;;
          esac
          if [ -n "$range" ] && git cat-file -e "${range%%..*}^{commit}" 2>/dev/null; then
            echo "Scanning $range"
            set -- --log-opts="$range"
          else
            echo "Scanning the whole history"
            set --
          fi
          if gitleaks git --redact --no-banner --report-format json --report-path gitleaks.json "$@" .; then
            echo "### Secrets: none found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Secrets: committed credentials found"
            echo
            echo "Rotate each one first (it's in git history now, so treat it as leaked), then remove it."
            echo
            echo "| Rule | File | Line | Commit |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | \(.Commit[0:8]) |"' gitleaks.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::Committed secret (\(.RuleID)) -- rotate it, then remove it"' gitleaks.json
          exit 1

  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Semgrep
        # Pinned; in a venv because the runner's system Python refuses
        # global pip installs.
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet semgrep==1.178.0
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: Scan code, Dockerfiles and workflows
        # Exit codes: 0 clean, 1 findings, anything else a broken scan (an
        # unreachable or misnamed ruleset): all but 0 fail the job, so a
        # scan that silently checked nothing can't pass.
        run: |
          set +e
          semgrep scan --metrics=off --disable-version-check --error \
            --config p/python --config p/typescript --config p/javascript --config p/golang --config p/rust \
            --config p/dockerfile --config p/github-actions --config p/secrets \
            --config .semgrep/ \
            --json --output semgrep.json .
          status=$?
          set -e
          if [ "$status" = "0" ]; then
            echo "### Code scan: no findings" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" != "1" ]; then
            echo "::error::Semgrep couldn't complete the scan (exit $status)."
            jq -r '.errors[]? | select(.level == "error") | .message' semgrep.json 2>/dev/null | head -20
            echo "### Code scan: Semgrep failed to run (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### Code scan: findings"
            echo
            echo "A finding with a real, reviewed reason can be suppressed on its line with \`# nosemgrep: <rule id>\` and the reason beside it."
            echo
            echo "| Severity | Rule | Where | What |"
            echo "|---|---|---|---|"
            jq -r '.results[] | "| \(.extra.severity) | \(.check_id | split(".") | last) | `\(.path):\(.start.line)` | \(.extra.message | gsub("\n"; " ") | .[0:200]) |"' semgrep.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line)::\(.check_id | split(".") | last): \(.extra.message | gsub("\n"; " "))"' semgrep.json
          exit 1

# Keyless: ESO signs in as the ServiceAccount eso-azure in this namespace,
# federated with a managed identity that may read this team's secrets in
# Azure Key Vault ("Key Vault Secrets User" on the vault): on AKS or any
# cluster whose OIDC issuer Entra trusts, since ESO asks for the token
# itself (README.md, Secrets). A scope reference only, never a secret value; the console applies
# it from the catalog's release after merge, checking it holds nothing else.
# Not yet proven against a real subscription.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-azure
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000   # CHANGE: the managed identity's client id
    azure.workload.identity/tenant-id: 00000000-0000-0000-0000-000000000000   # CHANGE
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://my-team-vault.vault.azure.net   # CHANGE
      serviceAccountRef:
        name: eso-azure

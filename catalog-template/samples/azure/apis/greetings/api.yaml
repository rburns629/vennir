# An API product (the catalog's README.md, API products) whose backend runs
# as an Azure Container App: the greetings backend (examples/greetings-api
# in the platform's repository), hosted by this team's greetings-backend
# template (container-app). Container Apps make the app's URL when they make
# it, so publish this after the template's run: replace the URL below (and
# openapi.yaml's servers) with the run's url, and the ids with yours.
#
# The app's built-in authentication answers 401 to anything without an
# Entra token for the backend's app registration (scope below) from the
# gateway's identity (clientId), and the backend still checks the gateway's
# signed Vennir-Caller. The gateway signs in as that identity with its own
# ServiceAccount's token (greetings-api, which the console creates in this
# team's namespace), so nothing is stored: a federated credential on it
# trusts the cluster's OIDC issuer for system:serviceaccount:azure:greetings-api,
# audience api://AzureADTokenExchange (the azure team's README.md, An API on
# it). An admin allows *.<region>.azurecontainerapps.io in gateway.backendHosts.
apiVersion: vennir.dev/v2
kind: Api
name: greetings
displayName: Greetings (Container Apps)
description: >-
  Greets someone by name, plainly or shouting, from a backend on Azure
  Container Apps that takes only the gateway's Entra token.
spec: openapi.yaml
backend:
  url: https://greetings.happyfield-0123abcd.eastus2.azurecontainerapps.io
  auth:
    entraToken:
      tenantId: 00000000-0000-0000-0000-000000000000                 # your tenant
      clientId: 11111111-1111-1111-1111-111111111111                 # the gateway's identity
      scope: api://22222222-2222-2222-2222-222222222222/.default     # the backend's app registration
access:
  requests: approval    # its team's maintainers grant or decline each request
limits:
  default: 60/min
timeout: 10s
maxRequest: 1KiB

# A sample: Resource group, with real Azure API calls (billed).
# Proven on AKS (2026-11-08); see the azure team's README.md.
apiVersion: vennir.dev/v2
kind: Product
name: resource-group
team: azure
displayName: Resource group
description: Finds a resource group by name, or creates it. Where everything later steps create
  goes.
owner: azure-team
# Azure from AKS, or from any cluster Entra trusts by OIDC (README.md, Azure
# from another cluster): its own clouds, over the team's [azure].
clouds: [azure, gcp, aws, existing]
# Its own identity: a managed identity federated to this ServiceAccount
# alone, with only what it does (README.md, Credentials).
serviceAccount: azure-resource-group
# Off AKS, a token for Entra, an hour long, at
# /platform/tokens/api___AzureADTokenExchange, with which it signs in as
# its own managed identity (the team secret azure-resource-group-identity).
# AKS's own Workload Identity needs none.
tokenAudiences:
- api://AzureADTokenExchange
runtime: python3.12
actions:
- name: create
  # Off AKS, its own identity (README.md, Credentials): a template's, the
  # Catalog's and a Delete's steps get only what an action lists here.
  # secretRefs: [{name: azure-resource-group-identity, keys: [client-id, tenant-id]}]
  # Finds what it would create before creating it, so a step that
  # failed on the platform's side (a reclaimed node, a timeout) is
  # retried, up to three attempts in all.
  idempotent: true
  maxAttempts: 3
  script: actions/create.py
  input:
    type: object
    additionalProperties: false
    required:
    - subscriptionId
    - name
    - location
    properties:
      subscriptionId:
        type: string
        description: The Azure subscription id.
        pattern: ^[0-9a-fA-F-]{36}$
      name:
        type: string
        description: The resource group's name.
        pattern: ^[-\w._()]{1,90}$
      location:
        type: string
        description: The Azure region, such as westeurope.
  output:
    type: object
    required:
    - resourceGroup
    - location
    - id
    properties:
      resourceGroup:
        type: string
        description: The group.
      location:
        type: string
        description: Where it is.
      id:
        type: string
        description: Its resource id.

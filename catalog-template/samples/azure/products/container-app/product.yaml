# A sample: Container App, with real Azure API calls (billed).
# Proven on AKS (2026-11-08); see the azure team's README.md.
apiVersion: vennir.dev/v2
kind: Product
name: container-app
team: azure
displayName: Container App
description: Deploys a container image as an Azure Container App, creating its Container Apps
  environment if needed, or returns the existing app's URL. Internal to the environment unless
  public is true; a private registry is pulled with a managed identity.
owner: azure-team
# Azure from AKS, or from any cluster Entra trusts by OIDC (README.md, Azure
# from another cluster): its own clouds, over the team's [azure].
clouds: [azure, gcp, aws, existing]
# Its own identity: a managed identity federated to this ServiceAccount
# alone, with only what it does (README.md, Credentials).
serviceAccount: azure-container-app
# Off AKS, a token for Entra, an hour long, at
# /platform/tokens/api___AzureADTokenExchange, with which it signs in as
# its own managed identity (the team secret azure-container-app-identity).
# AKS's own Workload Identity needs none.
tokenAudiences:
- api://AzureADTokenExchange
runtime: python3.12
actions:
- name: create
  # Off AKS, its own identity (README.md, Credentials): a template's, the
  # Catalog's and a Delete's steps get only what an action lists here.
  # secretRefs: [{name: azure-container-app-identity, keys: [client-id, tenant-id]}]
  # Finds what it would create before creating it, so a step that
  # failed on the platform's side (a reclaimed node, a timeout) is
  # retried, up to three attempts in all.
  idempotent: true
  maxAttempts: 3
  script: actions/create.py
  input:
    type: object
    additionalProperties: false
    required:
    - subscriptionId
    - resourceGroup
    - environmentName
    - appName
    - image
    - location
    properties:
      subscriptionId:
        type: string
        description: The Azure subscription id.
        pattern: ^[0-9a-fA-F-]{36}$
      resourceGroup:
        type: string
        description: Its resource group.
      environmentName:
        type: string
        description: The Container Apps environment, created if it doesn't exist.
      appName:
        type: string
        description: The app's name.
        pattern: ^[a-z][a-z0-9-]{0,30}[a-z0-9]$
      image:
        type: string
        description: An image reference.
      location:
        type: string
        description: The Azure region, such as westeurope.
      port:
        type: integer
        description: The port the container listens on.
        default: 8080
      public:
        type: boolean
        description: Whether anyone on the internet may reach it.
        default: false
      registryServer:
        type: string
        description: A private registry, such as myregistry.azurecr.io.
      registryIdentity:
        type: string
        description: 'The managed identity that pulls from it: a user-assigned identity''s
          resource id, or system.'
        default: system
      environment:
        type: object
        description: 'Environment variables for the container: names to string values. Never
          a secret: these are visible to anyone who can read the execution.'
        additionalProperties:
          type: string
      entraAuth:
        type: object
        description: 'Requires a Microsoft Entra token on every request (Container Apps''
          built-in authentication): 401 before the container for anything else. For an API
          behind the gateway''s entraToken (the azure team''s README.md, An API on it).'
        additionalProperties: false
        required: [tenantId, clientId, allowedApplications]
        properties:
          tenantId:
            type: string
            description: The Entra tenant's id.
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          clientId:
            type: string
            description: 'The backend''s own app registration: the audience its tokens must
              have.'
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          allowedApplications:
            type: array
            description: 'The client ids that may call it: the identity the gateway signs in
              as.'
            minItems: 1
            items:
              type: string
              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  output:
    type: object
    required:
    - appName
    - url
    - id
    properties:
      appName:
        type: string
        description: The app.
      url:
        type: string
        description: Its HTTPS URL.
      id:
        type: string
        description: Its resource id.

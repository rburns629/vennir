# A sample team whose products call real, billed Azure APIs. Copy it into
# teams/ (or one product into your own team) once its managed identities
# exist.
apiVersion: vennir.dev/v2
kind: Team
name: azure
displayName: Azure samples
description: >-
  Real Azure calls: a resource group, a Container App, and a PostgreSQL
  flexible server with Microsoft Entra sign-in only. Every action looks
  before it creates. Keyless: AKS Workload Identity, or off AKS the step's
  own token by federation, signs each step in.
owner: azure-team
contact: azure-team@example.com
# Its products run only on azure installs (listed, marked, not run
# elsewhere), unless a product.yaml says its own: all three run off AKS too.
clouds: [azure]
